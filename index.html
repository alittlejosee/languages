/* =====================================================================
   VIDEO: mục riêng, chia theo bài học (cấp độ) · chủ đề · bài hát
   ===================================================================== */
const VCATS={lesson:{n:"Theo bài học",ic:"📘"},topic:{n:"Theo chủ đề",ic:"🏷️"},song:{n:"Bài hát",ic:"🎵"}};
const VTOPICS=["Chào hỏi","Gia đình","Ăn uống","Mua sắm","Du lịch","Trường học","Công việc","Thời tiết","Sức khỏe","Thể thao","Đời sống hằng ngày","Phim & hoạt hình","Văn hóa & lễ hội","Tin tức"];
let VCUR=null, YTP=null, YT_P=null, vidLang="zh", vidCat="all", vidSub="", vidQ="";
function docVideos(){ return DOCS.filter(d=>(d.contentType||"").startsWith("video/")).map(d=>({id:"doc-"+d.id,title:d.title,cat:"lesson",level:d.level,kind:"file",assetId:d.assetId,srtId:d.srtId||null,fromDoc:true,createdAt:d.createdAt||0})); }
function allVideos(){ return [...VIDEOS_DB.filter(v=>VCATS[v.cat]), ...docVideos()]; }
function findVideo(id){ return allVideos().find(v=>v.id===id)||null; }
function hasSub(v){ return !!(v&&(v.srt||v.srtId)); }
function videoSubsText(v){ if(v.srt) return Promise.resolve(v.srt); if(v.srtId) return fetch(blobUrl(v.srtId)).then(r=>{ if(!r.ok) throw 0; return r.text(); }); return Promise.resolve(""); }
function ytIdOf(u){ u=String(u||"").trim(); const m=u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/); if(m) return m[1]; return /^[\w-]{11}$/.test(u)?u:null; }
function loadYT(){ if(YT_P) return YT_P; YT_P=new Promise((res,rej)=>{ if(window.YT&&YT.Player) return res(); const prev=window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady=()=>{ try{ prev&&prev(); }catch(e){} res(); }; const sc=document.createElement("script"); sc.src="https://www.youtube.com/iframe_api"; sc.onerror=()=>{ YT_P=null; rej(new Error("yt")); }; document.head.appendChild(sc); }); return YT_P; }
function mountYT(id){ YTP=null; loadYT().then(()=>{ const el=$("#ytBox"); if(!el||SH.ytId!==id) return; const pl=new YT.Player(el,{videoId:id,width:"100%",height:"100%",playerVars:{playsinline:1,rel:0,modestbranding:1,cc_load_policy:0,iv_load_policy:3},events:{onReady:()=>{ if(SH.ytId===id) YTP=pl; }}}); }).catch(()=>toast("Không tải được trình phát YouTube")); }
function ytWrap(p){ return { get currentTime(){ try{ return p.getCurrentTime()||0; }catch(e){ return 0; } }, set currentTime(t){ try{ p.seekTo(t,true); }catch(e){} }, set playbackRate(r){ try{ p.setPlaybackRate(r); }catch(e){} }, get ended(){ try{ return p.getPlayerState()===0; }catch(e){ return false; } }, play(){ try{ p.playVideo(); }catch(e){} return Promise.resolve(); }, pause(){ try{ p.pauseVideo(); }catch(e){} } }; }
function getVid(){ if(SH.ytId) return YTP?ytWrap(YTP):null; return $("#vid"); }
function vLabel(v){ return v.cat==="lesson"?lvName(v.level):v.cat==="topic"?(v.topic||"Chủ đề"):(v.artist||"Bài hát"); }
function vThumb(v){ const em=VCATS[v.cat]?VCATS[v.cat].ic:"🎬"; return `<div class="vth"><span>${em}</span>${v.kind==="youtube"&&v.ytId&&!window.claude?`<img src="https://i.ytimg.com/vi/${esc(v.ytId)}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">`:""}</div>`; }
function vCard(v){ const L=v.lessonId&&getLesson(v.lessonId);
  return `<button class="vc" data-go="video-${esc(v.id)}">${vThumb(v)}<div class="vb"><b>${esc(v.title)}</b>${v.vi?`<div class="muted" style="font-size:13px">${esc(v.vi)}</div>`:""}
    <div class="vchips"><span class="chipx">${VCATS[v.cat].ic} ${esc(vLabel(v))}</span>${v.cat!=="lesson"?`<span class="chipx">${esc(lvName(v.level))}</span>`:""}${L?`<span class="chipx zh">📘 ${esc(L.zh||"")}</span>`:""}${v.kind==="youtube"?'<span class="chipx">▶️ YouTube</span>':""}<span class="chipx">${hasSub(v)?"💬 Có phụ đề":"👁 Chỉ xem"}</span></div></div></button>`; }
function vSort(a,b){ if(a.cat==="lesson"&&b.cat==="lesson"){ const d=LEVELS.findIndex(l=>l.id===a.level)-LEVELS.findIndex(l=>l.id===b.level); if(d) return d; } return (b.createdAt||0)-(a.createdAt||0); }
function renderVideos(){
  const box=$("#videosBody"); if(!box) return;
  const all=allVideos(), langs=Object.keys(LANGS);
  const inLang=all.filter(v=>langOf(v.level)===vidLang).sort(vSort);

const WHISPER_LANG={zh:"chinese",ja:"japanese",ko:"korean",en:"english",de:"german",es:"spanish",fr:"french",ru:"russian"};
function srtStamp(t){ t=Math.max(0,t||0); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=Math.floor(t%60), ms=Math.round((t-Math.floor(t))*1000); const p=(n,l)=>String(n).padStart(l,"0"); return `${p(h,2)}:${p(m,2)}:${p(s,2)},${p(Math.min(ms,999),3)}`; }
function cuesToSrt(c){ return c.filter(x=>x.text&&x.text.trim()).map((x,i)=>`${i+1}\n${srtStamp(x.start)} --> ${srtStamp(Math.max(x.end,x.start+0.5))}\n${x.text.trim()}${x.vi?"\n"+x.vi:""}`).join("\n\n")+"\n"; }
function shiftSrt(txt,d){ return String(txt).replace(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/g,(m0,h,mi,se,ms)=>srtStamp((+h)*3600+(+mi)*60+(+se)+(+ms.padEnd(3,"0"))/1000+d)); }
function transcriptToSrt(raw){
  const lines=String(raw).replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean); const ts=/^(?:(\d+):)?(\d{1,2}):(\d{2})(?:\s+(.*))?$/; const cues=[]; let cur=null;
  lines.forEach(l=>{ const m=l.match(ts); if(m&&!/[^\d:\s]/.test(l.split(/\s/)[0])){ const t=(+m[1]||0)*3600+(+m[2])*60+(+m[3]); cur={start:t,text:m[4]||""}; cues.push(cur); } else if(cur){ if(/^\d+\s*(giây|seconds?|phút|minutes?)/i.test(l)) return; cur.text+=(cur.text&&!CJK(CUR_LANG)?" ":"")+l; } });
  if(!cues.length) return "";
  cues.forEach((c,i)=>{ c.end=i<cues.length-1?cues[i+1].start:c.start+Math.max(2,[...c.text].length*0.25); });
  return cuesToSrt(cues);
}
async function autoSubtitle(src, lang, say){
  say("Đang đọc âm thanh của video…");
  let buf; try{ buf=src instanceof Blob?await src.arrayBuffer():await (await fetch(src)).arrayBuffer(); }catch(e){ throw {msg:"Không tải được video để nghe (link chặn truy cập). Hãy tải file video lên."}; }
  if(buf.byteLength>200*1024*1024) throw {msg:"Video quá lớn để nghe trên trình duyệt (trên 200 MB)."};
  let audio; try{ const ctx=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,16000,16000); const ab=await ctx.decodeAudioData(buf.slice(0));
      const len=Math.ceil(ab.duration*16000); const off=new OfflineAudioContext(1,len,16000); const sn=off.createBufferSource(); sn.buffer=ab; sn.connect(off.destination); sn.start(); audio=(await off.startRendering()).getChannelData(0);
      if(ab.duration>20*60) throw {msg:"Video dài hơn 20 phút, hãy cắt ngắn rồi thử lại."}; }
  catch(e){ if(e&&e.msg) throw e; throw {msg:"Trình duyệt không đọc được âm thanh của file này. Hãy dùng MP4 / MP3 / WebM."}; }
  say("Đang tải bộ nghe giọng nói (lần đầu khoảng 1–2 phút, các lần sau nhanh hơn)…");
  let T; try{ T=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1"); }catch(e){ throw {msg:"Không tải được bộ nghe giọng nói. Kiểm tra mạng, hoặc dùng bản web riêng (GitHub) thay cho claude.ai."}; }
  let asr; try{ asr=await T.pipeline("automatic-speech-recognition","Xenova/whisper-base",{dtype:"q8",progress_callback:p=>{ if(p&&p.status==="progress"&&p.total) say(`Đang tải bộ nghe giọng nói… ${Math.round(p.loaded/p.total*100)}%`); }}); }
  catch(e){ throw {msg:"Không khởi động được bộ nghe giọng nói trên trình duyệt này (nên dùng Chrome / Edge trên máy tính)."}; }
  say(`Đang nghe và ghi phụ đề cho ${Math.round(audio.length/16000)} giây âm thanh… (có thể mất vài phút, đừng đóng trang)`);
  const out=await asr(audio,{language:WHISPER_LANG[lang]||"english",task:"transcribe",return_timestamps:true,chunk_length_s:30,stride_length_s:5});
  const ch=(out&&out.chunks)||[]; if(!ch.length) throw {msg:"Không nghe được lời nói nào trong video."};
  return cuesToSrt(ch.map(c=>({start:(c.timestamp&&c.timestamp[0])||0,end:(c.timestamp&&c.timestamp[1])||((c.timestamp&&c.timestamp[0])||0)+3,text:c.text})));
}

const HW_DATA_CACHE={};
function hwLoader(ch, onComplete, onError){
  if(HW_DATA_CACHE[ch]){ onComplete(HW_DATA_CACHE[ch]); return; }
  const done=d=>{ HW_DATA_CACHE[ch]=d; onComplete(d); };
  const url="https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/"+encodeURIComponent(ch)+".json";
  fetch(url).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(done)
    .catch(()=>import(url+"/+esm").then(m=>done(m.default||m)).catch(e=>onError&&onError(e)));
}

}

const YEDU = [{"title": "发现一种幸福的组成公式：生命力+掌控感+探索欲", "blocks": [{"type": "h2", "text": "心态积极，适当运动"}, {"type": "h3", "text": "由内而外滋养生命力"}, {"type": "p", "text": "幸福的人，大多拥有一个积极的心态，他们能接纳不完美的自己，允许生活里的一切自然发生。正如向日葵总是本能地面向阳光，他们积极的姿态，也会在不经意间吸引许多美好的事物靠近。"}, {"type": "p", "text": "不过，生活里谁都会遇到烦心事。有时越琢磨越焦虑，越纠结越内耗。想要打破这种僵局，最简单的办法就是让身体动起来。不用非得进行高强度的训练，也不追求马上练出健美的身材，先从一项你喜欢的运动开始，在挥汗如雨中感受生命的活力。"}, {"type": "p", "text": "生命是需要滋养的。当你怀着一颗积极的心，在汗水中积累能量，久而久之就会发现，不仅自己由内而外变得明媚、轻盈，那些困扰自己许久的问题，好像也在一呼一吸之间有了新眉目。"}, {"type": "h2", "text": "建立秩序，把握节奏"}, {"type": "h3", "text": "找到对生活的掌控感"}, {"type": "p", "text": "生活虽不必时时紧绷，但也不能总是散漫无序。所谓\"掌控感\"，并不是要你控制所有事情的走向，而是建立起属于自己的秩序。如果能把琐碎的日常逐一梳理，分出轻重缓急，自己内心也会感到踏实。"}, {"type": "p", "text": "想要找回对生活的掌控感，你可以试试改变自己的生活节奏。坚持早睡早起，精神就会越来越饱满，做事更有劲头；休息的时候放下手机，让自己从繁杂的信息中短暂抽身，感受具体生活的脉搏。"}, {"type": "p", "text": "当我们不再被动追赶生活，而是能够主动安排生活，合理分配自己的时间，把更多精力投入到眼前的事情上，就能慢慢摆脱焦虑和内耗。这样一来，即使生活偶尔有些风浪，也能稳住自己、从容面对。"}, {"type": "h2", "text": "拓展兴趣，培养爱好"}, {"type": "h3", "text": "在探索中发现可能性"}, {"type": "p", "text": "一些人觉得生活枯燥乏味，在日复一日中消磨了热爱。但也有一些人总能找到新鲜感，给平淡的日子增添了色彩。"}, {"type": "p", "text": "有人喜欢看电影，透过大银幕遇见不同的人生，在动人的故事里收获力量；有人开始学习手工，看着自己亲手完成的作品，心里就会十分满足。"}, {"type": "p", "text": "兴趣往往源于喜欢，一旦坚持下来，就会变成生活的一部分，帮我们拓展探索世界的视角，让我们发现原来生活还有这么多可能。"}, {"type": "p", "text": "说到底，幸福是一种选择，它掌握在我们自己手中。如果你正积极乐观地面对生活，请把这份旺盛的生命力继续保持下去；如果你正处在迷茫、焦虑当中，也不必苛求自己马上恢复状态，慢慢沉淀、用心生活，日子自会一天一天变得更好。"}], "vocab": [["滋养", "zīyǎng", "Tư dưỡng", "Động từ", "nuôi dưỡng, bồi bổ", "", "生命是需要滋养的。", "", "Sinh mệnh cần được nuôi dưỡng.", "阅读滋养心灵。", "", "Đọc sách nuôi dưỡng tâm hồn."], ["接纳", "jiēnà", "Tiếp nạp", "Động từ", "chấp nhận, đón nhận", "", "他们能接纳不完美的自己。", "", "Họ có thể chấp nhận sự không hoàn hảo của bản thân.", "学会接纳自己的缺点。", "", "Học cách chấp nhận khuyết điểm của bản thân."], ["允许", "yǔnxǔ", "Doãn hứa", "Động từ", "cho phép", "", "允许生活里的一切自然发生。", "", "Cho phép mọi thứ trong cuộc sống diễn ra tự nhiên.", "老师允许学生提问。", "", "Giáo viên cho phép học sinh đặt câu hỏi."], ["向日葵", "xiàngrìkuí", "Hướng nhật quỳ", "Danh từ", "hoa úc nào cũng căng thẳng.", "他神经紧绷。", "", "Thần kinh anh ấy căng thẳng."], ["散漫无序", "sǎnmànwúxù", "", "Cụm từ", "tản mạn vô trật tự", "", "但也不能总是散漫无序。", "", "Nhưng cũng không thể lúc nào cũng tản mạn vô trật tự.", "生活散漫无序会影响效率。", "", "Cuộc sống tản mạn vô trật tự sẽ ảnh hưởng hiệu suất."], ["掌控感", "zhǎngkònggǎn", "Chưởng khống cảm", "Danh từ", "cảm giác kiểm soát", "", "所谓掌控感。", "", "Cái gọi là cảm giác kiểm soát.", "找回对生活的掌控感。", "", "Tìm lại cảm giác kiểm soát cuộc sống."], ["控制", "kòngzhì", "Khống chế", "Động từ", "kiểm soát", "", "并不是要你控制所有事情的走向。", "", "Không phải là bạn phải kiểm soát mọi diễn biến của sự việc.", "学会控制自己的情绪。", "", "Học cách kiểm soát cảm xúc của bản thân."], ["秩序", "zhìxù", "Trật tự", "Danh từ", "trật tự", "", "建立起属于自己的秩序。", "", "Xây dựng trật tự riêng của bản thân.", "维持社会秩序。", "", "Duy trì trật tự xã hội."], ["琐碎", "suǒsuì", "Tỏa toái", "Tính từ", "vụn vặt, lặt vặt", "", "把琐碎的日常逐一梳理。", "", "Sắp xếp lần lượt những việc vụn vặt hàng ngày.", "生活中难免有琐碎的小事。", "", "Trong cuộc sống khó tránh khỏi những việc vụn vặt."], ["逐一梳理", "zhúyīshūlǐ", "", "Cụm động từ", "sắp xếp lần lượt từng cái", "", "把琐碎的日常逐一梳理。", "", "Sắp xếp lần lượt những việc vụn vặt hàng ngày.", "逐一梳理工作任务。", "", "Sắp xếp lần lượt các nhiệm vụ công việc."], ["踏实", "tāshi", "Đạp thực", "Tính từ", "yên tâm, vững dạ", "", "自己内心也会感到踏实。", "", "Trong lòng cũng sẽ cảm thấy yên tâm.", "做事要踏实。", "", "Làm việc cần vững vàng chắc chắn."], ["饱满", "bǎomǎn", "Bão mãn", "Tính từ", "đầy đặn, sung mãn", "", "精神就会越来越饱满。", "", "Tinh thần sẽ ngày càng sung mãn.", "他精神饱满地工作。", "", "Anh ấy làm việc với tinh thần sung mãn."], ["劲头", "jìntóu", "Kính đầu", "Danh từ", "khí thế, hăng hái", "", "做事更有劲头。", "", "Làm việc càng có khí thế hơn.", "工作充满劲头。", "", "Làm việc đầy khí thế hăng hái."], ["繁杂", "fánzá", "Phồn tạp", "Tính từ", "phức tạp rối rắm", "", "让自己从繁杂的信息中短暂抽身。", "", "Để bản thân tạm thời thoát khỏi những thông tin phức tạp.", "繁杂的手续让人头疼。", "", "Thủ tục phức tạp khiến người ta đau đầu."], ["抽身", "chōushēn", "Trừu thân", "Động từ", "rút thân ra khỏi", "", "从繁杂的信息中短暂抽身。", "", "Tạm thời rút khỏi những thông tin phức tạp.", "他很难从工作中抽身。", "", "Anh ấy khó lòng rút khỏi công việc."], ["脉搏", "màibó", "Mạch bác", "Danh từ", "mạch đập, nhịp đập", "", "感受具体生活的脉搏。", "", "Cảm nhận nhịp đập cụ thể của cuộc sống.", "医生检查病人的脉搏。", "", "Bác sĩ kiểm tra mạch đập của bệnh nhân."], ["合理分配", "hélǐfēnpèi", "", "Cụm động từ", "phân bổ hợp lý", "", "合理分配自己的时间。", "", "Phân bổ thời gian của mình một cách hợp lý.", "合理分配工作任务。", "", "Phân bổ nhiệm vụ công việc một cách hợp lý."], ["投入", "tóurù", "Đầu nhập", "Động từ", "đầu tư, dồn vào", "", "把更多精力投入到眼前的事情上。", "", "Dồn nhiều tâm sức hơn vào việc trước mắt.", "他全身心投入工作。", "", "Anh ấy dồn hết tâm huyết vào công việc."], ["摆脱", "bǎituō", "Bãi thoát", "Động từ", "thoát khỏi", "", "就能慢慢摆脱焦虑和内耗。", "", "Sẽ có thể dần thoát khỏi lo lắng và hao tổn nội tâm.", "摆脱不良习惯。", "", "Thoát khỏi thói quen xấu."], ["风浪", "fēnglàng", "Phong lãng", "Danh từ", "sóng gió", "", "即使生活偶尔有些风浪。", "", "Dù cuộc sống thỉnh thoảng có chút sóng gió.", "经历过人生的风浪。", "", "Đã trải qua sóng gió của cuộc đời."], ["从容", "cóngróng", "Tòng dung", "Tính từ", "ung dung, điềm tĩnh", "", "也能稳住自己、从容面对。", "", "Cũng có thể giữ vững bản thân, ung dung đối mặt.", "他从容地回答问题。", "", "Anh ấy ung dung trả lời câu hỏi."], ["枯燥乏味", "kūzàofáwèi", "", "Thành ngữ", "khô khan nhàm chán", "", "一些人觉得生活枯燥乏味。", "", "Một số người cảm thấy cuộc sống khô khan nhàm chán.", "这本书内容枯燥乏味。", "", "Nội dung cuốn sách này khô khan nhàm chán."], ["消磨", "xiāomó", "Tiêu ma", "Động từ", "tiêu hao, mài mòn", "", "在日复一日中消磨了热爱。", "", "Trong sự lặp lại từng ngày làm tiêu hao niềm đam mê.", "不要消磨自己的意志。", "", "Đừng để tiêu hao ý chí của bản thân."], ["平淡", "píngdàn", "Bình đạm", "Tính từ", "bình đạm, nhạt nhẽo", "", "给平淡的日子增添了色彩。", "", "Thêm sắc màu cho những ngày bình đạm.", "过着平淡的生活。", "", "Sống một cuộc sống bình đạm."], ["增添", "zēngtiān", "Tăng thiêm", "Động từ", "thêm vào, tăng thêm", "", "给平淡的日子增添了色彩。", "", "Thêm sắc màu cho những ngày bình đạm.", "为节日增添气氛。", "", "Tăng thêm không khí cho ngày lễ."], ["收获", "shōuhuò", "Thu hoạch", "Danh từ", "thu hoạch, thu được", "", "在动人的故事里收获力量。", "", "Thu được sức mạnh từ những câu chuyện cảm động.", "这次旅行让他收获很多。", "", "Chuyến đi này giúp anh ấy thu hoạch được nhiều điều."], ["手工", "shǒugōng", "Thủ công", "Danh từ", "thủ công", "", "有人开始学习手工。", "", "Có người bắt đầu học làm thủ công.", "这是手工制作的礼物。", "", "Đây là món quà làm thủ công."], ["源于", "yuányú", "Nguyên vu", "Động từ", "bắt nguồn từ", "", "兴趣往往源于喜欢。", "", "Sở thích thường bắt nguồn từ sự yêu thích.", "成功源于坚持。", "", "Thành công bắt nguồn từ sự kiên trì."], ["拓展", "tuòzhǎn", "Thác triển", "Động từ", "mở rộng phát triển", "", "帮我们拓展探索世界的视角。", "", "Giúp chúng ta mở rộng góc nhìn khám phá thế giới.", "拓展自己的知识面。", "", "Mở rộng kiến thức của bản thân."], ["视角", "shìjiǎo", "Thị giác", "Danh từ", "góc nhìn", "", "拓展探索世界的视角。", "", "Mở rộng góc nhìn khám phá thế giới.", "换个视角看问题。", "", "Nhìn vấn đề theo một góc độ khác."], ["掌握", "zhǎngwò", "Chưởng ác", "Động từ", "nắm vững, nắm trong tay", "", "它掌握在我们自己手中。", "", "Nó nằm trong tay chúng ta.", "掌握一门外语。", "", "Nắm vững một ngoại ngữ."], ["旺盛", "wàngshèng", "Vượng thịnh", "Tính từ", "vượng thịnh, mạnh mẽ", "", "请把这份旺盛的生命力继续保持下去。", "", "Hãy tiếp tục duy trì sức sống mạnh mẽ này.", "年轻人精力旺盛。", "", "Người trẻ tràn đầy năng lượng."], ["迷茫", "mímáng", "Mê mang", "Tính từ", "mơ hồ, mông lung", "", "如果你正处在迷茫、焦虑当中。", "", "Nếu bạn đang trong trạng thái mơ hồ, lo lắng.", "他对未来感到迷茫。", "", "Anh ấy cảm thấy mơ hồ về tương lai."], ["苛求", "kēqiú", "Khắc cầu", "Động từ", "đòi hỏi khắt khe", "", "也不必苛求自己马上恢复状态。", "", "Cũng không cần đòi hỏi khắt khe bản thân phải hồi phục ngay.", "不要苛求完美。", "", "Đừng đòi hỏi khắt khe sự hoàn hảo."], ["恢复", "huīfù", "Khôi phục", "Động từ", "khôi phục, phục hồi", "", "苛求自己马上恢复状态。", "", "Đòi hỏi khắt khe bản thân phải hồi phục trạng thái ngay.", "身体正在慢慢恢复。", "", "Cơ thể đang dần dần hồi phục."], ["沉淀", "chéndiàn", "Trầm điện", "Động từ", "lắng đọng, tích lũy dần", "", "慢慢沉淀、用心生活。", "", "Từ từ lắng đọng, sống hết lòng.", "经验需要时间沉淀。", "", "Kinh nghiệm cần thời gian để lắng đọng."]]}, {"title": "想要走出内耗，先要找到自己", "blocks": [{"type": "h2", "text": "认识自己"}, {"type": "h3", "text": "听听内心的声音"}, {"type": "p", "text": "很多时候，我们的内耗来源于我们对自己过苛刻。我们习惯了用外界的标准来衡量自己，用别人的成就来对比自己的不足。于是，我们心里更住进了一个严厉的\"审判官\"，随时准备指出我们的错误和失败。"}, {"type": "p", "text": "破解这种状态的关键，就在于先停下来，好好看一看自己，听听自己内心的声音。"}, {"type": "p", "text": "首先要弄清楚自己的特质。你是喜欢独处充电，还是需要在人群中获取能量？你是擅长深度钻研一件事，还是享受同时处理多种任务？这些没有好坏之分，只是不同的特点。当你足够了解自己时，就不会再用别人的标准来苛责自己。内向的人不必强迫自己变成社交达人，感性的人也不需要为自己的敏感道歉。"}, {"type": "p", "text": "还要想清楚自己的追求。抛开外界的期待和比较，问问自己：什么样的生活让我觉得踏实？做什么事情的时候，我会忘记时间？五年后、十年后，我希望自己成为什么样的人？这些问题不一定马上有答案，但每一次追问，都是在帮自己更好地认识自己。"}, {"type": "p", "text": "当我们能够更清楚地认识自己，也就不会再拿着别人的地图找自己的路。"}, {"type": "h2", "text": "接纳自己"}, {"type": "h3", "text": "与不完美和解"}, {"type": "p", "text": "我们总以为，只有变得完美，才能停止内耗。但真相恰恰相反：只有我们学会接纳自己的不完美，才能够摆脱内耗。"}, {"type": "p", "text": "接纳并非认命，而是承认\"这就是现在的我\"。承认自己会焦虑、会犹豫、会犯错。承认有些事我们暂时做不到，有些目标的实现还需要更长的时间。"}, {"type": "p", "text": "你可以试试，拿出一张纸，写下三件你觉得自己做得不够好的事，然后在每一项后面，加上一句\"但这不代表我不够好\"。比如\"我经常熬夜\"——但这不代表我不够好，只是说明我需要调整作息；\"我不太会拒绝别人\"——但这不代表我不够好，只是说明我在意他人的感受。"}, {"type": "p", "text": "这个过程不是为了美化缺点，而是为了把\"我不好\"和\"我有需要改善的地方\"区分开来。前者是全盘否定自己，后者是正视问题。只有先站在自己\"松绑\"，才能真正轻装上阵，活出更好的自己。"}, {"type": "h2", "text": "成为自己"}, {"type": "h3", "text": "在行动中找到答案"}, {"type": "p", "text": "认识并接纳自己后，我们也要努力成为自己。成为自己这件事，没有标准答案，也没有完美时机，它需要在每一天的具体行动中逐渐达成。"}, {"type": "p", "text": "也许你想学一门新技能，也许你想养成运动的习惯，也许你有一直有个创业的想法。不必等到完全准备好了再开始，不妨你先就开始做一点点：翻开第一页书，穿上跑鞋出门，写下第一份计划。"}, {"type": "p", "text": "在这个过程中，你会遇到困难，也会怀疑自己，但这正是成为自己的必经之路。每一次克服惰性，每一次咬牙坚持，都在塑造一个更强大的你。你会发现，原来自己的想象中更有韧性、更有力量。"}, {"type": "p", "text": "更重要的是，当你为一个真心向往的目标努力时，那种充实感和掌控感会慢慢取代内耗带来的空虚和疲惫。你不再把精力浪费在纠结和犹豫上，而是全部投入到让自己变好的过程中。"}, {"type": "p", "text": "不用和别人比快慢，只要今天的自己比昨天向前了一点点，就已经走在属于自己的路上。"}], "vocab": [["内耗", "nèihào", "Nội hao", "Danh từ", "hao tổn nội tâm", "", "我们的内耗来源于对自己过于苛刻。", "", "Sự hao tổn nội tâm của chúng ta bắt nguồn từ việc quá khắt khe với bản thân.", "减少无谓的内耗。", "", "Giảm bớt sự hao tổn nội tâm vô ích."], ["苛刻", "kēkè", "Khắc khắc", "Tính từ", "khắt khe, hà khắc", "", "对自己过于苛刻。", "", "Quá khắt khe với bản thân.", "要求苛刻。", "", "Yêu cầu khắt khe."], ["衡量", "héngliáng", "Hành lượng", "Động từ", "đánh giá, cân nhắc", "", "用别人的成就来衡量自己。", "", "Dùng thành tựu của người khác để đánh giá bản thân.", "衡量利弊。", "", "Cân nhắc lợi hại."], ["审判官", "shěnpànguān", "Thẩm phán quan", "Danh từ", "quan tòa (nghĩa bóng: người tự phán xét)", "", "心里住进了一个严厉的审判官。", "", "Trong lòng có một 'quan tòa' nghiêm khắc trú ngụ.", "内心的审判官很苛刻。", "", "Vị quan tòa trong lòng rất khắt khe."], ["破解", "pòjiě", "Phá giải", "Động từ", "tháo gỡ, giải mã", "", "破解这种状态的关键。", "", "Chìa khóa để tháo gỡ trạng thái này.", "破解难题。", "", "Giải mã bài toán khó."], ["特质", "tèzhì", "Đặc chất", "Danh từ", "đặc điểm, phẩm chất riêng", "", "弄清楚自己的特质。", "", "Hiểu rõ đặc điểm của bản thân.", "独特的特质。", "", "Phẩm chất độc đáo."], ["独处", "dúchǔ", "Độc xử", "Động từ", "ở một mình", "", "你是喜欢独处充电。", "", "Bạn thích ở một mình để nạp năng lượng.", "享受独处的时光。", "", "Tận hưởng khoảng thời gian ở một mình."], ["钻研", "zuānyán", "Toàn nghiên", "Động từ", "nghiên cứu sâu", "", "擅长深度钻研一件事。", "", "Giỏi nghiên cứu sâu một việc.", "钻研学问。", "", "Nghiên cứu sâu học vấn."], ["苛责", "kēzé", "Khắc trách", "Động từ", "trách móc khắt khe", "", "不会再用别人的标准来苛责自己。", "", "Sẽ không còn dùng tiêu chuẩn của người khác để trách móc bản thân.", "苛责自己没有意义。", "", "Trách móc bản thân khắt khe không có ý nghĩa."], ["感性", "gǎnxìng", "Cảm tính", "Tính từ", "giàu cảm xúc", "", "感性的人也不需要为自己的敏感道歉。", "", "Người giàu cảm xúc cũng không cần xin lỗi vì sự nhạy cảm của mình.", "她是个感性的人。", "", "Cô ấy là người giàu cảm xúc."], ["踏实", "tāshi", "Tháp thực", "Tính từ", "yên tâm, vững dạ", "", "什么样的生活让我觉得踏实。", "", "Cuộc sống như thế nào khiến tôi cảm thấy yên tâm.", "做事踏实。", "", "Làm việc chắc chắn yên tâm."], ["恰恰", "qiàqià", "Kháp kháp", "Phó từ", "đúng là, chính là", "", "真相恰恰相反。", "", "Sự thật lại đúng là ngược lại.", "恰恰相反。", "", "Ngược lại đúng như vậy."], ["认命", "rènmìng", "Nhận mệnh", "Động từ", "cam chịu số phận", "", "接纳并非认命。", "", "Chấp nhận không phải là cam chịu số phận.", "不肯认命。", "", "Không chịu cam chịu số phận."], ["犹豫", "yóuyù", "Do dự", "Động từ", "do dự, chần chừ", "", "承认自己会焦虑、会犹豫。", "", "Thừa nhận mình sẽ lo lắng, sẽ do dự.", "他很犹豫。", "", "Anh ấy rất do dự."], ["熬夜", "áoyè", "Ngao dạ", "Động từ", "thức khuya", "", "我经常熬夜。", "", "Tôi thường xuyên thức khuya.", "熬夜对身体不好。", "", "Thức khuya không tốt cho sức khỏe."], ["松绑", "sōngbǎng", "Tùng bang", "Động từ", "cởi trói, nới lỏng", "", "只有先站在自己这边松绑。", "", "Chỉ có đứng về phía mình để cởi trói trước.", "给自己松绑。", "", "Cởi trói cho chính mình."], ["轻装上阵", "qīngzhuāngshàngzhèn", "", "Thành ngữ", "nhẹ nhàng lên đường (bỏ gánh nặng)", "", "才能真正轻装上阵。", "", "Mới có thể thực sự nhẹ nhàng lên đường.", "轻装上阵，迎接挑战。", "", "Nhẹ nhàng lên đường, đón nhận thử thách."], ["惰性", "duòxìng", "Nọa tính", "Danh từ", "tính lười biếng, sức ì", "", "每一次克服惰性。", "", "Mỗi lần vượt qua sức ì.", "克服惰性。", "", "Vượt qua sức ì."], ["咬牙", "yǎoyá", "Giảo nha", "Động từ", "nghiến răng (chịu đựng)", "", "每一次咬牙坚持。", "", "Mỗi lần nghiến răng kiên trì.", "咬牙坚持到底。", "", "Nghiến răng kiên trì đến cùng."], ["韧性", "rènxìng", "Nhận tính", "Danh từ", "tính dẻo dai, kiên cường", "", "原来自己比想象中更有韧性。", "", "Hóa ra bản thân kiên cường hơn tưởng tượng.", "增强心理韧性。", "", "Tăng cường sức bền tâm lý."], ["充实感", "chōngshígǎn", "Sung thực cảm", "Danh từ", "cảm giác đầy đủ, sung túc", "", "充实感和掌控感会慢慢取代内耗。", "", "Cảm giác sung túc và cảm giác kiểm soát sẽ dần thay thế sự hao tổn nội tâm.", "工作带来充实感。", "", "Công việc mang lại cảm giác sung túc."], ["空虚", "kōngxū", "Không hư", "Tính từ", "trống rỗng", "", "内耗带来的空虚和疲惫。", "", "Sự trống rỗng và mệt mỏi do hao tổn nội tâm mang lại.", "感到空虚。", "", "Cảm thấy trống rỗng."]]}, {"title": "愿你拥有温柔，也成为温柔本身", "blocks": [{"type": "h2", "text": "温柔，是给予他人善意"}, {"type": "p", "text": "温柔，是一种美好的词，它有很多种动人的模样，给予他人善意便是其中之一。"}, {"type": "p", "text": "生活中，每个人都会遇到或大或小的挑战。虽然它们的难度系数并不相同，但是，面对挑战时，我们难免会产生失落、无助的感受，这时候就需要一些来自外界的认可、安慰与鼓励，支撑我们打起精神。"}, {"type": "p", "text": "可能是一个\"赞\"，可能是一句简单的\"加油\"，也可能是一段陪伴的时光。当温柔来临时，你所要做的，只是卸下内心的防备，去接纳和拥抱温柔，去感受自我和他人之间的温暖互动。"}, {"type": "h2", "text": "温柔，是有力量的选择"}, {"type": "p", "text": "有人说，温柔是懦弱的表现，是妥协的选择，其实恰恰相反，温柔是一种有力量的选择。"}, {"type": "p", "text": "看过一句话，\"一个人之所以温柔，大概是他在经历了困难之后，决定让身边的人不再经历这样的时刻。\"温柔，不一定天生的禀赋，而是在越过挑战后，依然对世界和生活充满热忱的能力。"}, {"type": "p", "text": "温柔待人的前提，是能够温柔对待自己。温柔的人，懂得不过度苛求自己，不妄自菲薄。金无足赤，人无完人，每个人都有自己的缺点和不足，而对努力过却并不满意的结果，请记得对自己说一句：没关系，我已经做得很好了。"}, {"type": "h2", "text": "温柔，是一种生活态度"}, {"type": "p", "text": "温柔，不单是说话得体、做事体贴，更是一种愿意理解对方、包容对方的生活态度。"}, {"type": "p", "text": "对家人温柔，珍惜家人的付出，把最好的情绪留给最爱的人；对朋友温柔，认真倾听好友的心事，设身处地给出切实的建议；对身边人温柔，当他们遇到困难时，给予力所能及的帮助。"}, {"type": "p", "text": "当你以温柔对待生活，生活也会以柔软的力量回馈你，让你成为更加柔软、善良、健康的人。愿你拥有温柔，也成为温柔本身。"}], "vocab": [["给予", "jǐyǔ", "Cấp dữ", "Động từ", "cho, ban tặng", "", "给予他人善意。", "", "Cho đi thiện ý với người khác.", "给予帮助。", "", "Cho đi sự giúp đỡ."], ["难免", "nánmiǎn", "Nan miễn", "Tính từ", "khó tránh khỏi", "", "难免会产生失落的感受。", "", "Khó tránh khỏi cảm giác thất vọng.", "犯错难免。", "", "Mắc lỗi là điều khó tránh."], ["支撑", "zhīchēng", "Chi sanh", "Động từ", "chống đỡ, nâng đỡ", "", "支撑我们打起精神。", "", "Nâng đỡ chúng ta lấy lại tinh thần.", "支撑家庭。", "", "Chống đỡ cho gia đình."], ["卸下", "xièxià", "Tá hạ", "Động từ", "tháo bỏ, dỡ xuống", "", "卸下内心的防备。", "", "Tháo bỏ sự phòng bị trong lòng.", "卸下重担。", "", "Trút bỏ gánh nặng."], ["拥抱", "yōngbào", "Ủng bão", "Động từ", "ôm, đón nhận", "", "去接纳和拥抱温柔。", "", "Đón nhận và ôm lấy sự dịu dàng.", "拥抱变化。", "", "Đón nhận sự thay đổi."], ["懦弱", "nuòruò", "Nọa nhược", "Tính từ", "nhu nhược, yếu đuối", "", "温柔是懦弱的表现。", "", "Dịu dàng là biểu hiện của sự yếu đuối.", "性格懦弱。", "", "Tính cách nhu nhược."], ["妥协", "tuǒxié", "Thỏa hiệp", "Động từ", "thỏa hiệp", "", "是妥协的选择。", "", "Là sự lựa chọn thỏa hiệp.", "拒绝妥协。", "", "Từ chối thỏa hiệp."], ["禀赋", "bǐngfù", "Bẩm phú", "Danh từ", "thiên phú, tư chất bẩm sinh", "", "不一定天生的禀赋。", "", "Không hẳn là tư chất bẩm sinh.", "天生的禀赋。", "", "Tư chất bẩm sinh."], ["热忱", "rèchén", "Nhiệt thầm", "Danh từ", "nhiệt tình, lòng nhiệt huyết", "", "依然对世界充满热忱。", "", "Vẫn tràn đầy nhiệt huyết với thế giới.", "工作热忱。", "", "Nhiệt huyết trong công việc."], ["苛求", "kēqiú", "Khắc cầu", "Động từ", "đòi hỏi khắt khe", "", "不过度苛求自己。", "", "Không đòi hỏi khắt khe quá mức với bản thân.", "苛求完美。", "", "Đòi hỏi khắt khe sự hoàn hảo."], ["妄自菲薄", "wàngzìfěibó", "", "Thành ngữ", "tự ti, tự đánh giá thấp bản thân", "", "不妄自菲薄。", "", "Không tự đánh giá thấp bản thân.", "不要妄自菲薄。", "", "Đừng tự ti về bản thân."], ["金无足赤", "jīnwúzúchì", "", "Thành ngữ", "vàng ròng không có (không ai hoàn hảo)", "", "金无足赤，人无完人。", "", "Vàng không ròng tuyệt đối, người không ai hoàn hảo.", "金无足赤，人无完人，谁都有缺点。", "", "Không ai hoàn hảo cả, ai cũng có khuyết điểm."], ["得体", "détǐ", "Đắc thể", "Tính từ", "đúng mực, phù hợp", "", "说话得体。", "", "Ăn nói đúng mực.", "穿着得体。", "", "Ăn mặc phù hợp."], ["包容", "bāoróng", "Bao dung", "Động từ", "bao dung, khoan dung", "", "愿意理解对方、包容对方。", "", "Sẵn lòng thấu hiểu và bao dung đối phương.", "包容彼此的缺点。", "", "Bao dung khuyết điểm của nhau."], ["设身处地", "shèshēnchǔdì", "", "Thành ngữ", "đặt mình vào vị trí người khác", "", "设身处地给出建议。", "", "Đặt mình vào vị trí người khác để đưa ra lời khuyên.", "设身处地为他人着想。", "", "Đặt mình vào vị trí người khác mà suy nghĩ."], ["力所能及", "lìsuǒnéngjí", "", "Thành ngữ", "trong khả năng của mình", "", "给予力所能及的帮助。", "", "Cho đi sự giúp đỡ trong khả năng của mình.", "做力所能及的事。", "", "Làm việc trong khả năng của mình."], ["回馈", "huíkuì", "Hồi quỹ", "Động từ", "đáp lại, đền đáp", "", "生活也会以柔软的力量回馈你。", "", "Cuộc sống cũng sẽ đáp lại bạn bằng sức mạnh mềm mại.", "回馈社会。", "", "Đền đáp xã hội."]]}, {"title": "能成事的人，都掌握了「五分钟法则」", "blocks": [{"type": "h2", "text": "别想那么多"}, {"type": "h3", "text": "先做五分钟再说"}, {"type": "p", "text": "你有没有过这样的时刻：明明打算去跑步，却一晚上都在家玩手机；明明该写方案，却反复整理桌面，就是不肯打开文档；明明该睡觉了，却告诉自己\"再刷一集\"，然后一抬头，已经凌晨。"}, {"type": "p", "text": "我们总以为，是自己不够自律、不够努力。其实，很多时候困住我们的，不是懒惰，而是\"开始\"两个字太重了。"}, {"type": "p", "text": "一想到要跑完五公里、写完一整套方案、读完一整本书，心里就先怯了。于是拖延成了本能，\"等一下\"成了口头禅，目标在一次次的\"明天再说\"中变成了遗憾。"}, {"type": "p", "text": "如果你发现某件事特别难启动，不妨试试\"五分钟法则\"——把任务拆解成五分钟就能完成的小目标，先做起来再说。"}, {"type": "h2", "text": "就做五分钟"}, {"type": "h3", "text": "是给自己的一个台阶"}, {"type": "p", "text": "人为什么会拖延？当你给自己设定的目标过高，比如\"今天我要学习10个小时\"，就会本能地想逃避，制造各种借口——状态不好、时间不够、不如明天再说。"}, {"type": "p", "text": "但如果你对自己说\"我只学五分钟\"，心态就放松了。五分钟而已，谁做不到呢？"}, {"type": "p", "text": "这就是\"五分钟法则\"的妙处：它不是在教你偷懒，而是在帮你降低心理门槛。把一个庞大的、令人望而生畏的目标，缩小成一个微不足道的、几乎不可能拒绝的小行动。"}, {"type": "p", "text": "就像推一辆停在原地的车，最费力的永远是起步的那一下。一旦轮子转起来了，后面反而轻松。五分钟，就是帮你把车推动的那一下。"}, {"type": "p", "text": "很多事情不是难在过程，而是难在启动。你缺的不是能力，不是时间，而是一个让自己\"动起来\"的理由。五分钟，就是那个理由。"}, {"type": "h2", "text": "五分钟之后"}, {"type": "h3", "text": "你会停不下来"}, {"type": "p", "text": "你可能会说：五分钟能做什么？背几个单词？看两页书？还点什么用的？"}, {"type": "p", "text": "但\"五分钟法则\"的关键，从来不是\"只做五分钟\"，而是\"先做五分钟\"。当你专注地做完第一个五分钟，大脑会进入一种轻度投入的状态，多数情况下，你会自然而然地进入下一个五分钟，而原先觉得难如登天的事情，就在这一个个零碎的片段里，悄悄向前推进了一大截。"}, {"type": "p", "text": "为了让这种惯性保持得更久，你还可以给每段投入之后一点点即时反馈。比如，你在完成一个\"五分钟\"后，站起来伸个懒腰、喝一口温水，或者在日历上给自己画一朵小花。"}, {"type": "p", "text": "一次、两次，乃至十次之后，你的大脑会把\"行动\"和\"愉悦\"绑定在一起，形成\"正反馈\"。那时，坚持就不再是意志力的消耗，而是一段让人身心愉快的旅程。"}, {"type": "p", "text": "今天来不及做完所有事，没关系；今天只推进了五分钟，也很好。改变从来不是靠单一刻的爆发，而是靠无数个\"五分钟\"的叠加重合。"}, {"type": "poem", "text": "开始越简单\n坚持越不费力\n愿你在每一个微小的开始里\n遇见那个更好的自己"}], "vocab": [["拖延", "tuōyán", "Đà duyên", "Động từ", "trì hoãn", "", "目标在一次次的\"明天再说\"中变成了遗憾。", "", "Mục tiêu qua từng lần \"để mai tính\" đã trở thành nuối tiếc.", "别拖延时间。", "", "Đừng trì hoãn thời gian."], ["怯", "qiè", "Khiếp", "Động từ", "sợ, rụt rè", "", "一想到要跑完五公里，心里就先怯了。", "", "Vừa nghĩ đến chạy hết năm cây số, trong lòng đã sợ trước.", "他有点怯场。", "", "Anh ấy hơi rụt rè trước đám đông."], ["口头禅", "kǒutóuchán", "Khẩu đầu thiền", "Danh từ", "câu cửa miệng", "", "\"等一下\"成了口头禅。", "", "\"Đợi chút\" đã trở thành câu cửa miệng.", "这是他的口头禅。", "", "Đây là câu cửa miệng của anh ấy."], ["拆解", "chāijiě", "Sách giải", "Động từ", "tách nhỏ, phân giải", "", "把任务拆解成小目标。", "", "Chia nhỏ nhiệm vụ thành các mục tiêu nhỏ.", "拆解问题。", "", "Phân giải vấn đề."], ["逃避", "táobì", "Đào tị", "Động từ", "trốn tránh", "", "就会本能地想逃避。", "", "Sẽ bản năng muốn trốn tránh.", "逃避责任。", "", "Trốn tránh trách nhiệm."], ["门槛", "ménkǎn", "Môn hạm", "Danh từ", "ngưỡng cửa, rào cản", "", "帮你降低心理门槛。", "", "Giúp bạn hạ thấp rào cản tâm lý.", "降低入门门槛。", "", "Hạ thấp rào cản gia nhập."], ["庞大", "pángdà", "Bàng đại", "Tính từ", "to lớn, đồ sộ", "", "一个庞大的目标。", "", "Một mục tiêu to lớn.", "庞大的计划。", "", "Kế hoạch đồ sộ."], ["望而生畏", "wàng'érshēngwèi", "", "Thành ngữ", "nhìn thấy đã sợ", "", "令人望而生畏的目标。", "", "Mục tiêu khiến người ta nhìn thấy đã sợ.", "任务让人望而生畏。", "", "Nhiệm vụ khiến người ta thấy khiếp sợ."], ["微不足道", "wēibùzúdào", "", "Thành ngữ", "nhỏ nhặt không đáng kể", "", "几乎不可能拒绝的小行动。", "", "Một hành động nhỏ hầu như không thể từ chối.", "这点困难微不足道。", "", "Khó khăn này nhỏ nhặt không đáng kể."], ["惯性", "guànxìng", "Quán tính", "Danh từ", "quán tính, thói quen", "", "让这种惯性保持得更久。", "", "Giữ cho quán tính này kéo dài lâu hơn.", "养成惯性思维。", "", "Hình thành tư duy theo quán tính."], ["反馈", "fǎnkuì", "Phản quỹ", "Danh từ", "phản hồi", "", "给每段投入一点点即时反馈。", "", "Cho mỗi giai đoạn đầu tư một chút phản hồi tức thì.", "及时反馈意见。", "", "Phản hồi ý kiến kịp thời."], ["绑定", "bǎngdìng", "Bang định", "Động từ", "gắn kết, ràng buộc", "", "把\"行动\"和\"愉悦\"绑定在一起。", "", "Gắn kết \"hành động\" và \"niềm vui\" với nhau.", "账号绑定手机。", "", "Tài khoản gắn kết với điện thoại."], ["消耗", "xiāohào", "Tiêu hao", "Động từ", "tiêu hao", "", "不再是意志力的消耗。", "", "Không còn là sự tiêu hao ý chí.", "消耗体力。", "", "Tiêu hao thể lực."], ["叠加", "diéjiā", "Điệp gia", "Động từ", "chồng chất, cộng dồn", "", "靠无数个\"五分钟\"的叠加重合。", "", "Dựa vào sự cộng dồn của vô số \"năm phút\".", "效果叠加。", "", "Hiệu quả cộng dồn."]]}, {"title": "别把别人的好，当成理所当然", "blocks": [{"type": "p", "text": "生活中，我们会遇见很多对自己好的人，这些好有时来得太自然，反而容易被忽略。人与人能够相遇已经难得，能够真心相待更值得珍惜。别等到失去了，才想起曾经有人，一直把你放在心上。"}, {"type": "h2", "text": "再温和的人，也有自己的底线"}, {"type": "p", "text": "有些人性格温和，别人开口求他，总是愿意搭把手；遇到一些小事，也常说\"没关系\"。很多时候，他们愿意多包容一些，多付出一些，是因为体谅对方，也珍惜彼此的这份情谊。"}, {"type": "p", "text": "可一个人愿意退让，并不代表他什么都不在意；经常包容他人，也会有觉得受委屈的时候。只是他们更愿意把话说得客气一些，不愿因为一时的情绪，让彼此闹得不痛快。再温和的人，也有自己的底线，再深厚的感情，也经不起一次次的消耗。"}, {"type": "p", "text": "所以，别因为一个人脾气好，就觉得他可以一直被辜负；别因为他为人不计较，就默认了他的委屈。与人相处，最舒服的状态，大概就是彼此都愿意为对方想想，也都懂得把这份包容放在心上。"}, {"type": "h2", "text": "关系的疏远，往往有迹可循"}, {"type": "p", "text": "生活中很少有突如其来的疏远。偶尔一次任性，偶尔一次没及时回应对方的感受，或许并没有什么，真正让关系发生变化的，往往是这些小事一次次累积，渐渐积累成了难以忽略的失望。"}, {"type": "p", "text": "相处久了，难免会有情绪，也难免有考虑不周的时候。重要的是，能不能回头想一想：刚才的话是不是说重了？自己的做法有没有让对方为难？如果总是习惯站在自己的角度，想当然地接受对方的迁就，甚至一次次得寸进尺，再好的关系也会渐渐消耗殆尽。"}, {"type": "p", "text": "一段好的关系，需要多一些换位思考、少一些理所当然，多一些反省自己的不足，多顾及几分对方的感受，关系才能走得更稳、更远。"}, {"type": "h2", "text": "珍惜别人的真心，也回应他们的真心"}, {"type": "p", "text": "一个人愿意对你好，背后往往藏着很多你看不见的付出。记得你的习惯，是因为把你放在心上；愿意听你说那些琐碎的小事，是因为在意你的感受；一次次为你留出时间，也是因为觉得这段关系值得。"}, {"type": "p", "text": "长久的关系，从来都是以心换心。当别人对你伸出援手，记得说一句谢谢；当别人愿意为你多考虑一些，也别只顾自己想要的。有时候，一份简单的回应，就足以让对方知道，这份心意没有被辜负。"}, {"type": "p", "text": "我们不可能珍惜身边的每一份善意，但别人给予的柔软，值得被放在心上，把别人对你的好用心记住。愿所有真心都有回应，所有相遇都能留下美好。"}], "vocab": [["底线", "dǐxiàn", "Để tuyến", "Danh từ", "giới hạn cuối cùng, ranh giới", "", "再温和的人，也有自己的底线。", "", "Người ôn hòa đến đâu cũng có giới hạn của riêng mình.", "坚守做人的底线。", "", "Giữ vững ranh giới làm người."], ["搭把手", "dābǎshǒu", "", "Động từ ngữ", "giúp một tay", "", "总是愿意搭把手。", "", "Luôn sẵn lòng giúp một tay.", "有困难就搭把手。", "", "Có khó khăn thì giúp một tay."], ["包容", "bāoróng", "Bao dung", "Động từ", "bao dung, khoan dung", "", "他们愿意多包容一些。", "", "Họ sẵn lòng bao dung hơn một chút.", "包容彼此的不足。", "", "Bao dung khuyết điểm của nhau."], ["退让", "tuìràng", "Thoái nhượng", "Động từ", "nhường nhịn, lùi bước", "", "一个人愿意退让。", "", "Một người sẵn lòng nhường nhịn.", "适当退让一步。", "", "Lùi một bước thích hợp."], ["委屈", "wěiqu", "Ủy khuất", "Danh từ", "ấm ức, tủi thân", "", "也会有觉得受委屈的时候。", "", "Cũng có lúc cảm thấy tủi thân.", "别让自己受委屈。", "", "Đừng để bản thân chịu ấm ức."], ["辜负", "gūfù", "Cô phụ", "Động từ", "phụ lòng", "", "就觉得他可以一直被辜负。", "", "Liền nghĩ rằng có thể mãi phụ lòng người đó.", "不要辜负别人的期望。", "", "Đừng phụ lòng mong đợi của người khác."], ["疏远", "shūyuǎn", "Sơ viễn", "Tính từ", "xa cách, sơ sài", "", "关系的疏远，往往有迹可循。", "", "Sự xa cách trong quan hệ thường có dấu hiệu để nhận biết.", "彼此渐渐疏远。", "", "Hai bên dần trở nên xa cách."], ["累积", "lěijī", "Luy tích", "Động từ", "tích lũy, chồng chất", "", "这些小事一次次累积。", "", "Những việc nhỏ này tích lũy dần qua từng lần.", "累积经验。", "", "Tích lũy kinh nghiệm."], ["迁就", "qiānjiù", "Thiên tựu", "Động từ", "nhân nhượng, chiều theo", "", "接受对方的迁就。", "", "Chấp nhận sự nhân nhượng của đối phương.", "一味迁就别人。", "", "Chỉ biết nhân nhượng người khác."], ["得寸进尺", "décùnjìnchǐ", "", "Thành ngữ", "được đằng chân lân đằng đầu", "", "甚至一次次得寸进尺。", "", "Thậm chí ngày càng được đằng chân lân đằng đầu.", "不要对他得寸进尺。", "", "Đừng được đằng chân lân đằng đầu với anh ấy."], ["殆尽", "dàijìn", "Đãi tận", "Động từ", "gần như cạn kiệt", "", "再好的关系也会渐渐消耗殆尽。", "", "Mối quan hệ dù tốt đến đâu cũng sẽ dần cạn kiệt.", "耐心消耗殆尽。", "", "Sự kiên nhẫn đã cạn kiệt."], ["换位思考", "huànwèisīkǎo", "", "Thành ngữ", "đặt mình vào vị trí người khác", "", "需要多一些换位思考。", "", "Cần đặt mình vào vị trí người khác nhiều hơn.", "学会换位思考。", "", "Học cách đặt mình vào vị trí người khác."], ["顾及", "gùjí", "Cố cập", "Động từ", "để ý đến, quan tâm đến", "", "多顾及几分对方的感受。", "", "Quan tâm hơn đến cảm nhận của đối phương.", "顾及他人感受。", "", "Quan tâm đến cảm nhận của người khác."], ["援手", "yuánshǒu", "Viện thủ", "Danh từ", "sự giúp đỡ, cánh tay cứu giúp", "", "当别人对你伸出援手。", "", "Khi người khác chìa tay giúp đỡ bạn.", "伸出援手。", "", "Chìa tay giúp đỡ."], ["琐碎", "suǒsuì", "Tỏa toái", "Tính từ", "vụn vặt, lặt vặt", "", "听你说那些琐碎的小事。", "", "Nghe bạn kể những chuyện vụn vặt.", "处理琐碎的事务。", "", "Xử lý những việc vụn vặt."]]}, {"title": "高能量的人，往往都有这5种特质", "blocks": [{"type": "h2", "text": "不苛责自己"}, {"type": "p", "text": "高能量的人，很少反复与自己拉扯。他们能够接纳自己的不完美，不拿别人的错误惩罚自己，也不用过高的标准苛责自己。"}, {"type": "p", "text": "高能量的人也会犯错，也会有状态不好的时候，但他们懂得把\"这件事没有做好\"和\"我这个人不够好\"区分开来。计划没有完成，就重新调整；能力有所欠缺，就认真弥补；暂时感到疲惫，就允许自己停下来休息。"}, {"type": "p", "text": "接纳自己，不是放任自己停在原地，而是不再苛责自己，消耗前行的力气。"}, {"type": "h2", "text": "但不被情绪裹挟"}, {"type": "p", "text": "人皆有喜怒哀乐，高能量的人，不是永远没有负面情绪。他们一样会经历迷茫、委屈与失落，但他们不会沉溺在坏情绪里。"}, {"type": "p", "text": "高能量的人，允许情绪像水一样流过自己。在感受到负面情绪时，他们不是强行压抑自己，而是坦然接纳情绪的到来。难过的时候就适度释放，不强迫自己假装坚强，情绪宣泄过后，及时抽离出来，分清情绪感受与客观现实。"}, {"type": "p", "text": "先安顿好心绪，再去处理问题，不被坏情绪困住脚步，这便是一种强大的内心力量。"}, {"type": "h2", "text": "张弛有度，劳逸结合"}, {"type": "p", "text": "懂得善待身体，就是守护精神能量。"}, {"type": "p", "text": "身体的状态，直接决定了情绪的承载力。好好吃饭，规律作息，适度运动。感到疲惫的时候就停下来休息，不必事事硬扛强，允许自己给生活留白。"}, {"type": "p", "text": "不必追求时刻精力充沛，懂得张弛有度，才是长久的生活智慧。"}, {"type": "h2", "text": "把精力留给重要的人和事"}, {"type": "p", "text": "一个人的时间和精力都是有限的。如果总在意所有人的评价、回应每一种声音、满足每一个人的期待，再充沛的能量也会在一次次勉强中被消耗。"}, {"type": "p", "text": "高能量的人，往往拥有清晰的边界。面对无意义的争论，他们不急着证明自己；面对不合理的要求，他们懂得坦然拒绝；面对别人的负面情绪，他们愿意关心，却不会把所有压力都背在自己身上。"}, {"type": "p", "text": "守住边界并非冷漠，而是懂得把宝贵的时间留给重要的人和事。"}, {"type": "h2", "text": "始终对生活保有期待"}, {"type": "p", "text": "能够长久滋养一个人的，往往是那些发自内心的喜欢。"}, {"type": "p", "text": "有人喜欢读书，在文字中看见更广阔的世界；有人喜欢运动，在一次次挥汗如雨中感受生命的活力；有人喜欢做饭、养花、摄影，在平凡的日子里发现细微的美好。这些爱好未必都要带来成就，也不一定需要得到别人的认可。仅仅因为喜欢，投入其中的时光就有了意义。"}, {"type": "p", "text": "高能量的人，通常会为自己保留一方这样的天地。当生活被琐事填满，热爱能让人重新感受到日子的温度；当暂时遇到低谷，心中的期待也会提醒我们：眼前的困难，并不是生活的全部。"}, {"type": "poem", "text": "人的能量不会永远充盈\n偶尔疲惫、迷茫、情绪低落\n都是生活中正常的时刻\n不必要求自己时时坚强\n也不必因为暂时走得慢\n就急着否定自己"}, {"type": "poem", "text": "累了就休息\n乱了就整理\n害怕时就试着迈出一小步\n愿我们都能照顾好\n自己的身体和感受\n保持积极向上的心态\n成为一个高能量的人"}], "vocab": [["苛责", "kēzé", "Khắc trách", "Động từ", "trách móc khắt khe", "", "不用过高的标准苛责自己。", "", "Không dùng tiêu chuẩn quá cao để trách móc khắt khe bản thân.", "苛责自己没有意义。", "", "Trách móc bản thân khắt khe không có ý nghĩa."], ["拉扯", "lāche", "Lạp xả", "Động từ", "giằng co, kéo qua kéo lại", "", "很少反复与自己拉扯。", "", "Rất ít khi giằng co qua lại với bản thân.", "内心不断拉扯。", "", "Nội tâm không ngừng giằng co."], ["裹挟", "guǒxié", "Khỏa hiệp", "Động từ", "cuốn theo, bị lôi kéo", "", "但不被情绪裹挟。", "", "Nhưng không bị cảm xúc cuốn theo.", "被舆论裹挟。", "", "Bị dư luận cuốn theo."], ["沉溺", "chénnì", "Trầm nịch", "Động từ", "chìm đắm", "", "不会沉溺在坏情绪里。", "", "Sẽ không chìm đắm trong cảm xúc tiêu cực.", "沉溺于过去。", "", "Chìm đắm trong quá khứ."], ["坦然", "tǎnrán", "Thản nhiên", "Tính từ", "bình thản, thản nhiên", "", "坦然接纳情绪的到来。", "", "Bình thản đón nhận cảm xúc ập đến.", "坦然面对失败。", "", "Bình thản đối mặt với thất bại."], ["宣泄", "xuānxiè", "Tuyên tiết", "Động từ", "giải tỏa, xả (cảm xúc)", "", "情绪宣泄过后。", "", "Sau khi giải tỏa cảm xúc.", "宣泄情绪。", "", "Giải tỏa cảm xúc."], ["安顿", "āndùn", "An đốn", "Động từ", "ổn định, sắp xếp yên ổn", "", "先安顿好心绪。", "", "Trước tiên ổn định tâm trạng.", "安顿好生活。", "", "Sắp xếp ổn định cuộc sống."], ["张弛有度", "zhāngchíyǒudù", "", "Thành ngữ", "căng chùng có chừng mực", "", "张弛有度，劳逸结合。", "", "Căng chùng có chừng mực, kết hợp làm việc và nghỉ ngơi.", "生活要张弛有度。", "", "Cuộc sống cần có căng có chùng."], ["劳逸结合", "láoyìjiéhé", "", "Thành ngữ", "kết hợp làm việc và nghỉ ngơi", "", "张弛有度，劳逸结合。", "", "Căng chùng có chừng mực, kết hợp làm việc và nghỉ ngơi.", "注意劳逸结合。", "", "Chú ý kết hợp làm việc và nghỉ ngơi."], ["承载力", "chéngzàilì", "Thừa tái lực", "Danh từ", "sức chịu đựng, khả năng chứa đựng", "", "直接决定了情绪的承载力。", "", "Trực tiếp quyết định khả năng chịu đựng cảm xúc.", "提升心理承载力。", "", "Nâng cao sức chịu đựng tâm lý."], ["留白", "liúbái", "Lưu bạch", "Động từ", "để trống, chừa khoảng trống", "", "允许自己给生活留白。", "", "Cho phép bản thân chừa khoảng trống cho cuộc sống.", "生活需要留白。", "", "Cuộc sống cần có khoảng trống."], ["边界", "biānjiè", "Biên giới", "Danh từ", "ranh giới, giới hạn", "", "往往拥有清晰的边界。", "", "Thường có ranh giới rõ ràng.", "设立边界感。", "", "Thiết lập cảm giác ranh giới."], ["冷漠", "lěngmò", "Lãnh mạc", "Tính từ", "lạnh lùng, thờ ơ", "", "守住边界并非冷漠。", "", "Giữ vững ranh giới không phải là lạnh lùng.", "态度冷漠。", "", "Thái độ lạnh lùng."], ["滋养", "zīyǎng", "Tư dưỡng", "Động từ", "nuôi dưỡng, bồi bổ", "", "能够长久滋养一个人的。", "", "Điều có thể nuôi dưỡng một người lâu dài.", "阅读滋养心灵。", "", "Đọc sách nuôi dưỡng tâm hồn."], ["琐事", "suǒshì", "Tỏa sự", "Danh từ", "việc vặt, việc lặt vặt", "", "当生活被琐事填满。", "", "Khi cuộc sống bị lấp đầy bởi những việc vặt.", "处理日常琐事。", "", "Xử lý việc vặt hàng ngày."], ["低谷", "dīgǔ", "Đê cốc", "Danh từ", "đáy vực, giai đoạn thấp điểm", "", "当暂时遇到低谷。", "", "Khi tạm thời gặp phải giai đoạn thấp điểm.", "走出人生低谷。", "", "Vượt qua giai đoạn thấp điểm của cuộc đời."]]}];

let PA_RATE=+store.get("srt_pa_rate",0.75)||0.75;
const pyBase=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-̄̌]/g,"").normalize("NFC").replace(/v/g,"ü").trim();
const sylChar=s=>SYL_CHAR[pyBase(s)]||"";
function paSay(text,rate){ CUR_LANG="zh"; say(text,rate||PA_RATE); }
function paSaySyl(list){ const cs=list.map(sylChar).filter(Boolean); if(!cs.length){ toast("Âm này chưa có mẫu đọc"); return; } paSay(cs.join("，")); }
const sylsOf=t=>(String(t).match(/[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]+/g)||[]);
function rateSel(id){ return `<label class="muted" style="font-size:13px;font-weight:600">🔊 Tốc độ đọc mẫu <select id="${id}" style="width:auto;padding:4px 8px;margin-left:4px">${[.5,.75,1,1.25,1.5].map(r=>`<option value="${r}" ${r===PA_RATE?"selected":""}>${r}x</option>`).join("")}</select></label>`; }
function bindRate(root,id){ const s=root.querySelector("#"+id); if(s) s.onchange=()=>{ PA_RATE=+s.value; store.set("srt_pa_rate",PA_RATE); }; }

/* ---------- Ghi âm & chấm một âm tiết ---------- */
const PA_REC={r:null,btn:null};
function paRecord(syl,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("Trình duyệt này không chấm phát âm được. Hãy dùng Chrome hoặc Edge."); return; }
  if(PA_REC.r){ try{ PA_REC.r.stop(); }catch(e){} return; }
  const r=new SR(); PA_REC.r=r; PA_REC.btn=btn; r.lang="zh-CN"; r.interimResults=false; r.maxAlternatives=5;
  btn.textContent="⏹"; btn.classList.add("recon");
  const target=pyBase(syl); let got=false;
  r.onresult=ev=>{ got=true; let best=0; const alts=[...ev.results[0]];
    alts.forEach(a=>{ let arr=[]; try{ arr=pinyinPro.pinyin(a.transcript.replace(/[^㐀-鿿]/g,""),{toneType:"none",type:"array"}).map(pyBase); }catch(e){}
      let s=arr[0]===target?10:arr.includes(target)?8:0;
      if(!s&&arr.length){ const ini=x=>(x.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxzcsryw])/)||[""])[0]; const t0=arr[0]; s=ini(t0)===ini(target)?5:(t0.replace(/^(zh|ch|sh|[bpmfdtnlgkhjqxzcsryw])/,"")===target.replace(/^(zh|ch|sh|[bpmfdtnlgkhjqxzcsryw])/,"")?5:2); }
      best=Math.max(best,s); });
    paScore(btn,best); };
  r.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed") toast("🔒 Hãy cho phép dùng micro để ghi âm"); };
  r.onend=()=>{ PA_REC.r=null; btn.textContent="🎙"; btn.classList.remove("recon"); if(!got) paScore(btn,-1); };
  try{ r.start(); }catch(e){ PA_REC.r=null; btn.textContent="🎙"; btn.classList.remove("recon"); }
}
function paScore(btn,s){ const sc=btn.parentElement.querySelector(".pysc"); if(!sc) return;

function ydUi(){
  const a=ydAll()[YD.i]; if(!a) return; const n=a.blocks.length; const pct=n>1?YD.p/(n-1)*100:0;

  const pb=$("#ydPlay"); if(pb) pb.textContent=YD.playing?"⏸":"▶";
  const lp=$("#ydLoop"), sh=$("#ydShuf"); if(lp) lp.classList.toggle("on",YD.loop); if(sh) sh.classList.toggle("on",YD.shuffle);
  document.querySelectorAll(".yd-b").forEach(el=>el.classList.toggle("cur",+el.dataset.yb===YD.p&&YD.playing));
}
function ydPlay(p){
  const a=ydAll()[YD.i]; if(!a) return; const n=a.blocks.length; YD.tok++; const my=YD.tok; YD.p=p; YD.playing=true; ydUi();
  { const k=ydSecs(a.blocks).findIndex(x=>x.h===p||x.items.includes(p)); if(k>=0&&YD.closed.has(k)&&!(ydSecs(a.blocks)[k].h===p)){ YD.closed.delete(k); const se=document.querySelector(`.yd-sec[data-sec="${k}"]`); if(se){ se.classList.remove("shut"); const t=se.querySelector(".yd-tg"); if(t) t.textContent="▾"; const c=se.querySelector(".yd-cnt"); if(c) c.remove(); } } }
  const el=document.querySelector(`.yd-b[data-yb="${p}"]`); if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
  CUR_LANG="zh"; try{ speechSynthesis.cancel(); }catch(e){}
  const txt=a.blocks[p].text.replace(/\n/g,"，");
  const next=()=>{ if(my!==YD.tok||!YD.playing) return; let q;
    if(YD.shuffle&&n>1){ do{ q=Math.floor(Math.random()*n); }while(q===p); } else q=p+1;
    if(q>=n){ if(YD.loop) q=0; else { YD.playing=false; YD.p=0; ydUi(); return; } }
    ydPlay(q); };
  try{ const u=utter(txt,PA_RATE); u.onend=()=>setTimeout(next,350); u.onerror=()=>{}; speechSynthesis.speak(u); }catch(e){ YD.playing=false; ydUi(); }
}

function ydTextToBlocks(t){ const out=[]; String(t).replace(/\r/g,"").split(/\n\s*\n/).forEach(ch=>{ const L=ch.split("\n").map(x=>x.trim()).filter(Boolean); if(!L.length) return;
    if(L.every(x=>x.startsWith(">"))){ out.push({type:"poem",text:L.map(x=>x.replace(/^>\s*/,"")).join("\n")}); return; }
    let buf=[]; const flush=()=>{ if(buf.length){ out.push({type:"p",text:buf.join("")}); buf=[]; } };
    L.forEach(x=>{ const h=x.match(/^(#{2,3})\s*(.+)$/); if(h){ flush(); out.push({type:h[1].length===2?"h2":"h3",text:h[2].trim()}); } else buf.push(x.replace(/^>\s*/,"")); }); flush(); });
  return out; }
function ydBlocksToText(B){ return (B||[]).map(b=>b.type==="h2"?"## "+b.text:b.type==="h3"?"### "+b.text:b.type==="poem"?b.text.split("\n").map(x=>"> "+x).join("\n"):b.text).join("\n\n"); }
function ydVocToText(V){ return (V||[]).map(v=>[v[0],v[1],v[2],v[3],v[4],v[6],v[8]].map(x=>x||"").join(" | ").replace(/( \| )+$/,"")).join("\n"); }
function ydTextToVoc(t){ return String(t).split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(a=>a[0]&&hasHan(a[0])).map(a=>[a[0],a[1]||autoPy(a[0],"zh"),a[2]||"",a[3]||"",a[4]||"","",a[5]||"","",a[6]||"","","",""]).slice(0,150); }

      }catch(e){ TV.mode="free"; startFree(); }

function traceCanvas(box){
  const c=document.createElement("canvas"); const w=box.clientWidth||260; c.width=w*2; c.height=w*2; c.className="tv-canvas"; box.appendChild(c);
  const ctx=c.getContext("2d"); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=hwColor(); ctx.lineWidth=w*0.055;
  let drawing=false, last=null;
  const pt=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]; };
  c.addEventListener("pointerdown",e=>{ drawing=true; last=pt(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7); ctx.fillStyle=ctx.strokeStyle; ctx.fill(); });
  c.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pt(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; });
  const end=()=>{ drawing=false; }; c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
}

function hanRuns(s){ return (String(s||"").match(/[一-鿿]+/g)||[]); }
function grammarFor(text, note, lang, lessonGrammar){
  const out=[]; if(note) out.push({t:"Ghi chú ngữ pháp",d:note,src:"note"});
  if((lang||CUR_LANG)!=="zh") return out;
  const used=new Set();
  (lessonGrammar||[]).forEach(g=>{ const runs=hanRuns(g.f).concat(hanRuns(g.t)).filter(r=>r!=="是"||hanRuns(g.f).length===1); if(runs.some(r=>text.includes(r))){ out.push({t:g.t,f:g.f,d:g.d,src:"lesson"}); runs.forEach(r=>used.add(r)); } });
  GRAMMAR_LIB.filter(g=>g.re.test(text)).sort((a,b)=>b.p-a.p).forEach(g=>{ if(hanRuns(g.f).some(r=>used.has(r))) return; out.push({t:g.t,f:g.f,d:g.d,src:"lib"}); });
  return out.slice(0,5);
}
function grHTML(list){
  if(!list.length) return `<div class="muted" style="font-size:13px">Câu này không có điểm ngữ pháp đáng chú ý.</div>`;

}

function ocrClean(t,lang){
  let lines=String(t||"").replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
  if(CJK(lang)||lang==="ko"){
    const scr=lang==="ko"?/[\uac00-\ud7af]/g:/[\u3400-\u9fff\u3040-\u30ff]/g;
    lines=lines.filter(l=>{ const h=(l.match(scr)||[]).length, la=(l.match(/[A-Za-z\u00c0-\u024f]/g)||[]).length; return h>=2&&h>=la; });

    if(lang!=="ko") lines=lines.map(l=>l.replace(/\s+/g,"").replace(/,/g,"，").replace(/"/g,"”"));
    const all=lines.join(lang==="ko"?" ":"");
    return (all.match(/[^。！？!?]+[。！？!?]+[”"」』’]?|[^。！？!?]+$/g)||[]).map(x=>x.trim()).filter(x=>[...x].length>1&&(/[。！？!?”"」』’]$/.test(x)||[...x].length>4)).join("\n");
  }

  return (all.match(/[^.!?]+[.!?]+["”»']?|[^.!?]+$/g)||[]).map(x=>x.trim()).filter(x=>x.length>1).join("\n");
}
async function ocrPrep(src){

/* Giáo trình in màu (bản scan 2 trang/ảnh): tách đôi trang, đọc cả chữ Việt, tự nhận bố cục */
function bookHalves(src){
  const w=src.width, h=src.height; if(!w||!h) return [src];
  const parts=w>h*1.2?[[0,Math.floor(w/2)],[Math.floor(w/2),w]]:[[0,w]];
  return parts.map(([a,b])=>{ const k=Math.max(.5,Math.min(2.5,1700/Math.max(1,b-a))); const cv=document.createElement("canvas"); cv.width=Math.round((b-a)*k); cv.height=Math.round(h*k);
    const cx=cv.getContext("2d"); cx.imageSmoothingQuality="high"; cx.filter="grayscale(1) contrast(1.25)"; cx.drawImage(src,a,0,b-a,h,0,0,cv.width,cv.height); return cv; });
}
async function ocrBook(getPage, n, lang, onProg){
  try{ await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"); }catch(e){ throw {msg:"Không tải được bộ nhận dạng chữ. Kiểm tra mạng rồi thử lại."}; }
  const say=t=>{ try{ onProg&&onProg(t); }catch(e){} }; let cur=0, t0=Date.now();
  say("Đang tải bộ nhận dạng chữ (lần đầu hơi lâu)…");
  const L=(OCR_LANG[lang]||"eng")+(lang==="vi"?"":"+vie");
  let w; try{ w=await Tesseract.createWorker(L,1,{logger:m=>{ if(m.status==="recognizing text"){ const el=(Date.now()-t0)/1000, left=cur?Math.round(el/cur*(n-cur)/60):0; say(`Đang đọc trang ${cur+1}/${n} … ${Math.round((m.progress||0)*100)}%${left?` · còn khoảng ${left} phút`:""}`); } }}); }
  catch(e){ throw {msg:"Không khởi động được bộ nhận dạng chữ trên trình duyệt này."}; }
  try{ await w.setParameters({tessedit_pageseg_mode:"3",preserve_interword_spaces:"1"}); }catch(e){}
  const out=[]; try{ for(cur=0;cur<n;cur++){ const img=await getPage(cur); if(!img) continue; let src=img; if(img instanceof Blob){ try{ src=await createImageBitmap(img); }catch(e){ continue; } }

  finally{ try{ await w.terminate(); }catch(e){} }
  return out.join("\n");
}

function ocrRaw(t,lang){ return String(t||"").replace(/\r/g,"").split("\n").map(l=>{ l=l.trim(); if(CJK(lang)) l=l.replace(/([\u3400-\u9fff\u3040-\u30ff，。！？：；、])\s+(?=[\u3400-\u9fff\u3040-\u30ff，。！？：；、])/g,"$1"); return l; }).filter(Boolean).join("\n"); }

const VI_RE=/[ăâđêôơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/i;
const isViLine=l=>VI_RE.test(l)&&!hasHan(l);
function splitSentences(text, lang){
  const re=CJK(lang)||lang==="ko"?/[^。！？!?]+[。！？!?]?[”"」』]?/g:/[^.!?]+[.!?]?["”»]?/g;
  return (String(text).match(re)||[]).map(x=>x.trim()).filter(x=>x&&x.length>1);
}
function parseStoryText(raw, lang, fileName){
  const lines=String(raw).replace(/\r/g,"").split("\n").map(l=>l.replace(/\u00a0/g," ").trim()).filter(Boolean);
  const out={zh:"",vi:"",sentences:[],keywords:[],phrases:[]}; let sec="body";
  const isForeign=l=>CJK(lang)?(hasHan(l)||/[\u3040-\u30ff]/.test(l)):(lang==="ko"?/[\uac00-\ud7af]/.test(l):!isViLine(l));
  const body=[];
  lines.forEach(l=>{
    if(/^(#+\s*)?(từ khóa|từ khoá|từ vựng|từ mới|keywords?|vocabulary|生词|单词)\s*[:：]?$/i.test(l)){ sec="kw"; return; }
    if(/^(#+\s*)?(cụm từ|cụm từ tự nhiên|phrases?|短语|词组)\s*[:：]?$/i.test(l)){ sec="ph"; return; }
    if(/^(#+\s*)?(nội dung|bài đọc|truyện|text|课文)\s*[:：]?$/i.test(l)){ sec="body"; return; }
    if(sec!=="body"){ const a=l.replace(/^[-•*\d.)\s]+/,"").split(/\s*[|｜\t]\s*|\s+[-–:：]\s+/); if(a[0]){ const k={w:a[0].trim(),py:"",vi:""}; if(a.length>=3){ k.py=a[1].trim(); k.vi=a.slice(2).join(" ").trim(); } else if(a.length===2){ if(isViLine(a[1])) k.vi=a[1].trim(); else k.py=a[1].trim(); } if(!k.py) k.py=autoPy(k.w,lang); (sec==="kw"?out.keywords:out.phrases).push(k); } return; }
    body.push(l);
  });
  // tiêu đề
  if(body.length&&body[0].length<=30&&!/[。！？.!?]$/.test(body[0])){ out.zh=body.shift(); if(body.length&&isViLine(body[0])&&body[0].length<=60) out.vi=body.shift(); }
  if(!out.zh) out.zh=(fileName||"Bài đọc mới").replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").slice(0,60);
  // nội dung
  for(let i=0;i<body.length;i++){
    const l=body[i];
    if(l.includes("|")){ const a=l.split("|"); const o={zh:a[0].trim(),vi:(a[1]||"").trim()}; const g=a.slice(2).join("|").trim(); if(g) o.g=g; if(o.zh) out.sentences.push(o); continue; }
    if(isForeign(l)){
      const next=body[i+1];
      if(next&&!next.includes("|")&&isViLine(next)){
        const fs=splitSentences(l,lang), vs=splitSentences(next,"vi");
        if(fs.length>1&&fs.length===vs.length) fs.forEach((f,k)=>out.sentences.push({zh:f,vi:vs[k]}));
        else out.sentences.push({zh:l,vi:next});
        i++; continue;
      }
      splitSentences(l,lang).forEach(f=>out.sentences.push({zh:f,vi:""}));
    }
  }
  return out;
}

// ===== ĐIỀN THÔNG TIN SUPABASE VÀO 2 DÒNG DƯỚI (dán vào GIỮA 2 dấu ngoặc kép) =====
let SUPABASE_URL = "";        // ← Project URL, ví dụ: "https://abcdxyz.supabase.co"
let SUPABASE_ANON_KEY = "";   // ← khóa anon public (KHÔNG dùng khóa service_role)
// (Nếu dùng biến môi trường trên Vercel thì để trống 2 dòng trên, web tự đọc từ config.js)
if(window.SRT_CONFIG){ SUPABASE_URL = SUPABASE_URL || SRT_CONFIG.url || ""; SUPABASE_ANON_KEY = SUPABASE_ANON_KEY || SRT_CONFIG.anonKey || ""; }
const SB_ON = !!(SUPABASE_URL && SUPABASE_ANON_KEY) && !window.claude;
let SB=null, SESSION=null;
function makeSbDb(sb){
  const subs=new Map();
  const colOf=path=>path.split("/").slice(0,-1).join("/");
  const idOf=path=>path.split("/").pop();
  const snapFrom=rows=>{ const docs=rows.map(r=>({id:idOf(r.path),exists:true,data:()=>r.data,metadata:{fromCache:false}})); return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false},docChanges:()=>[]}; };
  const fail=e=>({code:/row-level|permission|policy/i.test(e&&e.message||"")?"invalid_argument":"unavailable",message:e&&e.message||"lỗi"});
  async function fetchCol(col){ const {data,error}=await sb.from("store").select("path,data").eq("col",col); if(error) throw fail(error); return data||[]; }
  async function refresh(col){ const ls=subs.get(col); if(!ls||!ls.size) return; try{ const sn=snapFrom(await fetchCol(col)); ls.forEach(o=>o.next(sn)); }catch(e){ ls.forEach(o=>o.err&&o.err(e)); } }
  setInterval(()=>{ if(!document.hidden) subs.forEach((v,k)=>refresh(k)); },25000);
  const docRef=path=>({ id:idOf(path), path,
    async get(){ const {data,error}=await sb.from("store").select("data").eq("path",path).maybeSingle(); if(error) throw fail(error); return {id:idOf(path),exists:!!data,data:()=>data?data.data:undefined,metadata:{fromCache:false}}; },
    async set(d){ const {error}=await sb.from("store").upsert({path,col:colOf(path),data:d,updated_at:new Date().toISOString()}); if(error) throw fail(error); refresh(colOf(path)); },
    async update(d){ const cur=await this.get(); await this.set(Object.assign({},cur.data()||{},d)); },
    async delete(){ const {error}=await sb.from("store").delete().eq("path",path); if(error) throw fail(error); refresh(colOf(path)); },
    onSnapshot(next,err){ const col=colOf(path); const o={next:sn=>{ const r=sn.docs.find(x=>x.id===idOf(path)); next(r||{id:idOf(path),exists:false,data:()=>undefined}); },err}; if(!subs.has(col)) subs.set(col,new Set()); subs.get(col).add(o); refresh(col); return ()=>subs.get(col).delete(o); },
    collection:sub=>colRef(path+"/"+sub) });
  const newId=()=>(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/-/g,"").slice(0,20);
  const colRef=col=>({ path:col, doc:id=>docRef(col+"/"+(id||newId())), async add(d){ const r=docRef(col+"/"+newId()); await r.set(d); return r; },
    orderBy(){ return this; }, where(){ return this; }, limit(){ return this; },
    async get(){ return snapFrom(await fetchCol(col)); },
    onSnapshot(next,err){ if(!subs.has(col)) subs.set(col,new Set()); const o={next,err}; subs.get(col).add(o); refresh(col); return ()=>subs.get(col).delete(o); } });
  return {doc:docRef,collection:colRef};
}
function makeSbAssets(sb){
  return {
    async upload(blob,opt){ const type=(opt&&opt.type)||blob.type||"application/octet-stream"; const ext=(blob.name&&extOf(blob.name))||Object.keys(TYPE_BY_EXT).find(k=>TYPE_BY_EXT[k]===type)||"bin";
      const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36))+"."+ext;
      const {error}=await sb.storage.from("files").upload(id,blob,{contentType:type,upsert:false}); if(error) throw {code:/size|large/i.test(error.message)?"too_large":"upstream_error",message:error.message};
      return {id,url:blobUrl(id),sizeBytes:blob.size,contentType:type}; },
    async delete(id){ await sb.storage.from("files").remove([id]); return {deleted:true}; },
    async list(){ return {assets:[],usage:{}}; }
  };
}

async function initSupabase(){
  try{ await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"); }catch(e){ toast("Không tải được thư viện đăng nhập. Kiểm tra mạng."); return false; }
  try{ sessionStorage.removeItem("srt_pw_reset"); }catch(e){}
  SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:true}});
  DB=makeSbDb(SB);
  const {data}=await SB.auth.getSession(); SESSION=data.session;
  SB.auth.onAuthStateChange((ev,s)=>{ const a=SESSION&&SESSION.user&&SESSION.user.id, b2=s&&s.user&&s.user.id; SESSION=s; if(a!==b2&&!sessionStorage.getItem("srt_pw_reset")){ if(!b2){ ["srt_profile","srt_profile_uid","srt_last"].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); } if(b2) sbGoIn(); else { location.hash="dang-ky"; location.reload(); } } });
  if(SESSION){
    const u=SESSION.user, meta=u.user_metadata||{}; UID=u.id;
    ME={name:meta.full_name||meta.name||(u.email||"").split("@")[0],avatarUrl:meta.avatar_url||meta.picture||"",email:u.email};
    if(store.get("srt_profile_uid","")!==UID){ try{ localStorage.removeItem("srt_profile"); }catch(e){} store.set("srt_profile_uid",UID); }
    const pend=store.get("srt_pending_profile",null); if(pend&&pend.email===(u.email||"").toLowerCase()&&!myProfile()){ store.set("srt_profile",pend); try{ localStorage.removeItem("srt_pending_profile"); }catch(e){} }
    let role="student";
    try{ const r=await DB.doc("roles/"+UID).get(); if(r.exists) role=r.data().role||"student"; }catch(e){ console.warn("Không đọc được vai trò:",e); }
    if(role==="student"){ try{ const {data:rr,error:re}=await SB.rpc("my_role"); if(!re&&rr) role=rr; }catch(e){} }
    IS_ADMIN=role==="teacher"||role==="admin"; IS_OWNER=role==="admin";
    if(IS_ADMIN) ASSETS=makeSbAssets(SB);
  } else { try{ localStorage.removeItem("srt_profile"); }catch(e){} }
  return true;
}

setFont(store.get("srt_font","modern"));
