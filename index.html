<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舒如天上星 – Học ngoại ngữ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f7fd; --card:#fff; --ink:#22344a; --muted:#6b7f96; --line:#d6e6f7;
  --p:#5b9bd5; --p-dark:#3f7fbf; --p-soft:#dcebfa; --p-softer:#eef5fd; --sky:#a9cff2;
  --ok:#2f9e6e; --ok-soft:#dcf5ea; --no:#d4566a; --no-soft:#fde4e8; --gold:#f2b84b; --navy:#1f3a5c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bgimg,var(--bg));background-attachment:fixed;transition:background-color .6s;color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:15px;line-height:1.5}
.zh{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
body.f-kai .zh,body.f-kai .zh *{font-family:"Be Vietnam Pro","KaiTi","STKaiti","Kaiti SC","Kaiti TC","BiauKai","Ma Shan Zheng",serif}
body.f-song .zh,body.f-song .zh *{font-family:"Be Vietnam Pro","Noto Serif SC","Songti SC","STSong","SimSun","NSimSun",serif}
body.f-kai rt,body.f-song rt{font-family:"Be Vietnam Pro",sans-serif!important}
.f-prev-modern{font-family:"Noto Sans SC",sans-serif!important}.f-prev-kai{font-family:"Be Vietnam Pro","KaiTi","STKaiti","Kaiti SC","BiauKai","Ma Shan Zheng",serif!important}.f-prev-song{font-family:"Be Vietnam Pro","Noto Serif SC","Songti SC","SimSun",serif!important}
.fontsel{flex:none;border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;font-size:13px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}

/* Header */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:3px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--sky);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(91,155,213,.25);cursor:pointer}
.brand{cursor:pointer}
.brand h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.02em}
.brand .t1{font-size:12px;color:var(--muted)}



.top .sp{flex:1}
.hbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.hbtn.fill{background:var(--p);border-color:var(--p);color:#fff}
.hbtn.out{border-color:var(--p);color:var(--p-dark)}
.hbtn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.hbtn:hover{filter:brightness(1.04)}
.menu{position:relative}
.hchip{border:2px solid #f6d3c4;background:#fff5f0;border-radius:12px;padding:5px 9px;font-weight:700;font-size:13px;color:#d0623c;white-space:nowrap}
.hchip.blue{border-color:var(--sky);background:var(--p-softer);color:var(--p-dark)}
.acc{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px 3px 3px;font-weight:700;font-size:13px;white-space:nowrap}
#accName{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.acc-av{width:30px;height:30px;border-radius:50%;background:var(--p-soft);display:grid;place-items:center;overflow:hidden}
.acc-av img{width:100%;height:100%;object-fit:cover}
.acc em{font-style:normal;font-size:11px;background:var(--p-soft);color:var(--p-dark);border-radius:6px;padding:1px 6px}
.acc-dd{width:270px;padding:8px}
.acc-dd button{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;border-radius:12px;padding:12px 12px;font-weight:600;font-size:15px;text-align:left}
.acc-dd button:hover{background:var(--p-softer)}
.acc-dd .out{color:var(--no)}
.sv-bar{background:#fff1d6;color:#8a5d06;text-align:center;font-size:13px;font-weight:600;padding:6px}
.sv-bar button{border:none;background:none;text-decoration:underline;font-weight:700;color:#8a5d06}
/* Giới thiệu */
.gv-hero{text-align:center;background:linear-gradient(180deg,var(--p-softer),#fff);border:2px solid var(--line)}
.gv-av{width:120px;height:120px;border-radius:50%;margin:0 auto 10px;border:4px solid var(--sky);background:#fff;display:grid;place-items:center;font-size:44px;font-weight:800;color:var(--p-dark);overflow:hidden}
.gv-av img{width:100%;height:100%;object-fit:cover}
.gv-hero h2{margin:0;font-size:30px}
.gv-hero .bio{max-width:640px;margin:8px auto 16px;color:#40546b;white-space:pre-line}
.gv-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.gv-btns a{background:var(--p);color:#fff;text-decoration:none;font-weight:700;border-radius:99px;padding:10px 20px}
.gv-btns a:hover{background:var(--p-dark)}
.gv-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.gv-stat{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.gv-stat b{display:block;font-size:28px;color:var(--p-dark)}
.gv-stat span{font-size:13px;color:var(--muted)}
.gv-h3{margin:0 0 10px;font-size:18px}
.gv-list{margin:0;padding-left:20px;line-height:1.8}
.pf-stats{background:var(--p-softer);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
@media(max-width:820px){.gv-stats{grid-template-columns:repeat(2,1fr)}}
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.ct{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:inherit;background:#fbfdff;transition:.15s}
.ct:hover{border-color:var(--p);transform:translateY(-1px)}
.ct .i{width:50px;height:50px;border-radius:14px;background:var(--p-softer);display:grid;place-items:center;font-size:24px;flex:none}
.ct b{display:block}
.ct small{color:var(--muted);word-break:break-all}
.ct .ar{margin-left:auto;color:var(--muted);font-size:20px}
@media(max-width:820px){.ct-grid{grid-template-columns:1fr}}
.dd{position:absolute;right:0;top:46px;width:280px;max-height:75vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 34px rgba(34,52,74,.15);padding:14px;z-index:40}
.dd h4{margin:0 0 8px;font-size:15px}
.dd .grp{background:var(--p-softer);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.dd .grp small{font-weight:600;color:var(--muted)}
.dd .lv{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.dd .lv button{border:2px solid var(--sky);border-radius:10px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--p-dark);background:#fff}
.dd .lv button:hover{background:var(--p);color:#fff}

/* Generic */
.wrap{max-width:1100px;margin:22px auto 50px;padding:0 16px}
.card{background:var(--card);border-radius:24px;box-shadow:0 8px 28px rgba(63,127,191,.10);padding:24px 26px}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--p);color:var(--p-dark)}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.btn.p:hover{background:var(--p-dark);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.red{border-color:#f1b7c0;color:var(--no)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:10px}
.btn.on{background:var(--p-soft);border-color:var(--p);color:var(--p-dark)}
.btn:disabled{opacity:.5;cursor:default}
.chipx{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--p-softer);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* Home */
.home{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:30px 16px}
.home-in{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;max-width:980px;width:100%}
.home-art{aspect-ratio:1;border-radius:28px;background:radial-gradient(circle at 30% 25%,#ffffff 0 3px,transparent 4px),radial-gradient(circle at 75% 35%,#fff 0 2px,transparent 3px),radial-gradient(circle at 60% 75%,#fff 0 2px,transparent 3px),radial-gradient(circle at 20% 70%,#fff 0 1.5px,transparent 2.5px),linear-gradient(160deg,var(--sky),var(--p) 60%,var(--p-dark));display:grid;place-items:center;box-shadow:0 18px 40px rgba(63,127,191,.3);position:relative;overflow:hidden}
.home-art .big{font-size:58px;color:#fff;font-weight:700;letter-spacing:.08em;text-shadow:0 4px 18px rgba(0,0,0,.18)}
.home-art .sub{position:absolute;bottom:22px;color:#e6f2ff;font-size:14px}
.home-txt{text-align:center}
.home-txt h2{font-size:34px;margin:0 0 22px}
.home-txt .t1{color:var(--p-dark);font-weight:600}
.home-txt .t2{color:var(--muted);font-style:italic;margin-bottom:26px}
.home-txt .btn{display:block;width:100%;max-width:340px;margin:12px auto;padding:13px;font-size:15px;letter-spacing:.04em}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:18px}

/* Course */
.intro{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;border:2px solid var(--line);background:linear-gradient(180deg,#fff,#f6faff)}
.intro .lg{width:84px;height:84px;border-radius:50%;background:#fff;border:3px solid var(--sky);display:grid;place-items:center}
.intro h2{margin:0;font-size:22px}
.stat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.intro-txt{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:12px;color:#40546b;font-size:14px}
.lvtabs{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.lvt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 16px;text-align:left;font-weight:700;color:var(--p-dark);min-width:92px}
.lvt small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.lvt .soon{display:inline-block;font-size:10px;background:#fff1d6;color:#b07a12;border-radius:6px;padding:0 6px;margin-top:2px}
.lvt.on{background:var(--p-soft);border-color:var(--p)}
.lgroup{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:6px;width:100%}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:22px;padding:22px 6px 10px;border-top:2px solid var(--line)}
.lc{position:relative;text-align:center}
.lc .ring{width:78px;height:78px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;border:6px solid var(--p-soft);background:#fff;color:var(--p-dark);cursor:pointer;transition:.15s}
.lc .ring:hover{transform:scale(1.06)}
.lc.done .ring{border-color:var(--ok);color:var(--ok)}
.lc.part .ring{border-color:var(--sky)}
.lc.lock .ring{color:#b9c6d4;border-color:#eef2f6;cursor:default}
.lc.draft .ring{border-style:dashed}
.lc .nm{font-size:12px;margin-top:6px;color:var(--muted);line-height:1.25}
.lpop{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:5;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(34,52,74,.16);padding:12px 14px;width:220px;text-align:center}
.lpop b{color:var(--p-dark)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .ic{font-size:40px}
.docs{margin-top:26px;border:2px solid var(--line)}
.docs-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.docs-h h3{margin:0;font-size:19px}
.dfilter{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.doc{display:flex;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.doc .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--p-softer);flex:none}
.doc .tt{font-weight:700;word-break:break-word}
.doc .meta{font-size:12px;color:var(--muted)}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.doc .note{font-size:13px;color:#4a5d73;margin-top:2px}

/* Modal */
.mback{position:fixed;inset:0;background:rgba(20,36,56,.45);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:22px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(1000px,100%)}
.modal h3{margin:0 0 12px;font-size:19px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.modal h3 .x{border:none;background:none;font-size:22px;color:var(--muted)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fld input[type=text],.fld input[type=number],.fld input[type=email],.fld select,.fld textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.fld textarea{min-height:110px;font-family:"Noto Sans SC","Be Vietnam Pro",sans-serif;line-height:1.6}
.fld .hint{font-size:12px;color:var(--muted);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:2px dashed var(--sky);border-radius:16px;padding:18px;text-align:center;background:var(--p-softer);cursor:pointer}
.drop.over{background:var(--p-soft);border-color:var(--p)}
.err{background:var(--no-soft);color:var(--no);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.okm{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.viewer iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px}
.viewer img,.viewer video{max-width:100%;border-radius:12px;display:block;margin:0 auto;max-height:70vh}
.viewer pre{white-space:pre-wrap;background:var(--p-softer);border-radius:12px;padding:12px;max-height:65vh;overflow:auto;font-family:"Noto Sans SC",monospace;font-size:14px}

/* Admin */
.adm-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.adm-h h2{margin:0;font-size:30px;font-weight:800}
.me{display:flex;align-items:center;gap:10px;background:#e7eef7;border-radius:99px;padding:6px 16px 6px 6px;font-weight:700}
.me img{width:36px;height:36px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.stat{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;gap:12px;align-items:center}
.stat .si{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{font-size:13px;font-weight:600}
.stat small{display:block;font-size:11px;color:var(--muted)}
.atabs{display:flex;gap:10px;flex-wrap:wrap;padding:16px;border-bottom:2px solid var(--line)}
.atab{flex:1;min-width:170px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:600;color:#4a5d73}
.atab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.apanel{padding:18px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid #edf2f8;vertical-align:middle}
.who{display:flex;align-items:center;gap:8px}
.who img{width:30px;height:30px;border-radius:50%}
.bar{height:8px;border-radius:9px;background:var(--p-softer);overflow:hidden;width:120px}
.bar i{display:block;height:100%;background:var(--p)}
.lvchips{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.lvchip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;display:flex;align-items:center;gap:8px}
.lvchip em{font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--ok-soft);color:var(--ok)}
.lvchip em.soon{background:#fff1d6;color:#b07a12}
.lvchip.on{background:var(--p);border-color:var(--p);color:#fff}
.lrow{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.lrow .n{width:34px;height:34px;border-radius:50%;background:var(--p-soft);display:grid;place-items:center;font-weight:800;color:var(--p-dark)}
.lrow .tt{flex:1;min-width:180px}
.tag{font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px}
.tag.pub{background:var(--ok-soft);color:var(--ok)}
.tag.draft{background:#fff1d6;color:#b07a12}

/* Lesson */
.steps{position:sticky;top:79px;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 12px rgba(34,52,74,.04)}
.steps-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 18px;overflow-x:auto;scrollbar-width:thin}
.steps .x{border:none;background:none;font-size:18px;color:var(--muted);padding:4px 6px}
.lesson-name{font-weight:700;color:var(--p-dark);white-space:nowrap;font-size:14px;padding-right:6px}
.st{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:5px 10px 5px 6px;position:relative}
.st .n{width:22px;height:22px;border-radius:50%;background:var(--p-softer);color:var(--p-dark);display:grid;place-items:center;font-size:11px;font-weight:700}
.st .lb{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.st .lb b{font-size:12px;font-weight:600;white-space:nowrap}
.st .lb i{font-style:normal;font-size:10px;color:var(--muted)}
.st.on{background:var(--p);border-color:var(--p);color:#fff}
.st.on .n{background:#fff;color:var(--p-dark)}
.st.on .lb i{color:#e6f1fc}
.st.done:not(.on) .n{background:var(--ok);color:#fff}
.st.done::after{content:"";position:absolute;left:10px;right:10px;bottom:-2px;height:3px;border-radius:3px;background:var(--ok)}
.st .new{position:absolute;top:-7px;right:-4px;background:var(--gold);color:#fff;font-size:9px;font-weight:800;border-radius:6px;padding:0 4px}
.pytog{flex:none;margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;padding-left:10px}
.lmain{max-width:980px;margin:22px auto 40px;padding:0 16px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.sec-h .ic{font-size:26px}
.sec-h h2{margin:0;font-size:22px;color:var(--p-dark)}
.sec-h .zh{color:var(--muted);font-size:15px}
.pill{font-size:11px;font-weight:800;background:#fff1d6;color:#b07a12;border-radius:8px;padding:2px 8px}
.guide{color:var(--muted);margin:2px 0 18px}
.nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.fb{margin-top:12px;font-weight:600;border-radius:12px;padding:10px 14px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--no-soft);color:var(--no)}
rt{font-family:"Be Vietnam Pro",sans-serif;font-size:.55em;color:var(--p-dark);font-weight:500}
body.nopy rt{visibility:hidden}
.w{cursor:pointer;border-radius:6px;padding:0 1px;transition:background .15s}
.w:hover{background:#fff3c4}
.w.cur{background:#ffe08a}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.slot{border:2px solid #9fcaf0;border-radius:16px;padding:12px;text-align:center;position:relative;background:#fff}

.slot.ok{border-color:var(--ok)} .slot.ok .dz{border-color:var(--ok);background:var(--ok-soft)}
.slot.no{border-color:var(--no)} .slot.no .dz{border-color:var(--no);background:var(--no-soft)}
.bank{border:2px solid #9fcaf0;border-radius:16px;padding:12px 14px;margin-top:16px}

.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;text-align:center;min-width:78px;box-shadow:0 2px 0 var(--line)}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}

.vc .act .btn{padding:3px 9px;white-space:nowrap}
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc{width:min(420px,100%);height:250px;perspective:1000px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}

.back{background:#fff;border:2px solid var(--sky);transform:rotateY(180deg)}

.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(420px,100%)}

.gp{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;background:#fff}

.dlg{display:flex;flex-direction:column;gap:12px}
.bub{display:flex;gap:10px;align-items:flex-start;max-width:85%}
.bub.r{align-self:flex-end;flex-direction:row-reverse}

.bub .tx{background:var(--p-softer);border:1.5px solid var(--line);border-radius:16px;padding:8px 12px}

.sh{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.stage{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--sky) 0%,var(--p) 55%,var(--p-dark) 100%);color:#fff}
.stage .lbl{position:absolute;left:14px;top:10px;font-size:12px;opacity:.85}
.stage .board{position:absolute;left:50%;top:9%;transform:translateX(-50%);background:#2e5d4b;border:5px solid #c9a46a;border-radius:6px;padding:4px 18px;font-size:20px;color:#eaf7ef;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.ppl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:70px;padding-top:70px;padding-bottom:90px}
.per{text-align:center;opacity:.5;transition:.25s;transform:scale(.92)}
.per.talk{opacity:1;transform:scale(1.06)}
.per .a{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:42px;border:3px solid transparent}
.per.talk .a{border-color:#fff3b0;box-shadow:0 0 0 7px rgba(255,243,176,.22)}
.per .nm{font-size:13px;margin-top:4px}
.cap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 14px;background:linear-gradient(transparent,rgba(16,36,64,.82));text-align:center}

.cap .vi{font-size:14px;opacity:.9}
.cap rt,.capbox rt{color:#cfe6ff}
.cap .w.cur,.capbox .w.cur{background:#ffe08a;color:#22344a}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.prog i{display:block;height:100%;width:0;background:#fff3b0;transition:width .3s}
video.pl{width:100%;display:block;border-radius:18px 18px 0 0;background:#000;max-height:420px}
.capbox{background:var(--navy);color:#fff;border-radius:0 0 18px 18px;padding:10px 14px;text-align:center;min-height:60px}

.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}

.tg{display:flex;gap:6px;align-items:center;font-size:14px}
.turn{margin-top:12px;border:2px solid var(--p);background:var(--p-softer);border-radius:16px;padding:12px 14px}

.cues{max-height:470px;overflow:auto;border:1.5px solid var(--line);border-radius:16px;padding:6px}
.cue{display:flex;gap:10px;padding:8px;border-radius:12px;cursor:pointer;border:1.5px solid transparent}

.cue .nm{font-size:11px;font-weight:700;color:var(--p-dark)}
.cue .zhs{font-size:19px;line-height:1.9}
.cue .vi{font-size:13px;color:var(--muted)}
.cz{background:var(--p-soft)!important;color:transparent!important;border-bottom:2px solid var(--p)}

.srcbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.note{font-size:13px;background:#fff6e0;color:#8a5d06;border-radius:12px;padding:8px 12px}

.ex-item{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:#fff}

.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.opt.no{background:var(--no-soft);border-color:var(--no);color:var(--no)}

.ans-line{min-height:56px;border:2px dashed var(--sky);border-radius:14px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--p-softer);margin:8px 0}

.tok{border:2px solid var(--sky);background:#fff;border-radius:12px;padding:4px 12px;font-size:20px}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.mi{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;text-align:left;font-size:18px}

.mi.no{border-color:var(--no);background:var(--no-soft)}

#pop{position:fixed;z-index:85;width:280px;background:#fff;border:1.5px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(34,52,74,.2);padding:14px 16px}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}

}

.lwrap .st.done::after{display:none}

@media(max-width:900px){

  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,255,255,.95);border-top:2px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:12px}
  .bnav i{font-style:normal;font-size:20px}
  .bnav button.on{color:var(--p-dark);background:var(--p-softer)}
  body{padding-bottom:70px}
  .pbar{bottom:80px}
  .hero{grid-template-columns:1fr;text-align:left}.hero-r{display:none}
  .lwrap{grid-template-columns:1fr;padding:0 0 30px;gap:0}
  .lwrap .steps{position:sticky;top:54px;z-index:20;border-radius:0;border-width:0 0 1.5px;max-height:none}
  .lwrap .steps-in{flex-direction:row;overflow-x:auto;padding:8px 10px}
  .lwrap .lesson-name{display:none}
  .lwrap .st{width:auto;flex:none;border:1.5px solid var(--line)}
  .lwrap .lmain{padding:12px}
  .path:before{left:24px}.pl-dot{width:36px;height:36px}
}

.acc-lock{grid-column:1/-1;border:2px dashed var(--line);border-radius:20px;padding:20px;text-align:center;background:#fff;margin-bottom:14px}
.acc-lock .ic{font-size:40px}
.acc-lock.wait{border-color:#f0c96a;background:#fffaf0}
.acc-lock.denied{border-color:#f2a7b4;background:#fff5f7}
.pl.locked .pl-card{cursor:not-allowed;opacity:.6}
.lvt .lk{display:block;font-size:11px;font-weight:600;opacity:.8}
.ap-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 4px;border-bottom:1px solid var(--line)}
.ap-row:last-child{border-bottom:0}
.ap-row .tt{flex:1;min-width:200px}
.ap-lv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.ap-lv label{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;background:#fff}
.ap-lv label.on{background:var(--p-softer);border-color:var(--p)}
.bk-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.bk-tabs button,.bk-lv button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:7px 13px;font:inherit;font-weight:700;cursor:pointer;color:inherit}
.bk-tabs button.on{background:var(--p);border-color:var(--p);color:#fff}
.bk-lv{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.bk-lv button{border-width:1.5px;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;background:var(--p-softer)}
.bk-lv button.on{background:var(--p-dark);border-color:var(--p-dark);color:#fff}

.acc-cell{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:150px}
.acc-cell .chipx{font-size:11px;padding:2px 8px;white-space:nowrap}
.acc-cell .chipx.pend{background:#fff4d6;border-color:#f0c96a}
.mini{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:1px 6px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;margin-left:3px;line-height:1.5}
.mini.ok{background:#d9f3e4;border-color:#9fd8b6;color:#1f7a4f}
.mini.no{background:#fde0e4;border-color:#f2a7b4;color:#b23a50}
.adm-side .an b{white-space:nowrap}

.rfull{display:block}
.rf-text{background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px 26px;font-size:24px;line-height:2.3}
.rf-text p{margin:0 0 14px;text-indent:2em}
.rf-text p:last-child{margin-bottom:0}
.sf{cursor:pointer;border-radius:8px;transition:background .15s;padding:2px 0}
.sf:hover{background:var(--p-softer)}
.sf.play{background:var(--p-soft);box-shadow:0 0 0 3px var(--p-soft)}
.rf-vi{background:#fff;border:2px dashed var(--line);border-radius:18px;padding:16px 20px;margin-top:12px;line-height:1.8;font-size:15px}
.rf-vi p{margin:0 0 10px}
.sfv.play{background:#fff4d6;border-radius:6px}
.rf-panel{position:sticky;bottom:84px;margin-top:12px;background:#fff;border:2px solid var(--p);border-radius:20px;padding:12px 16px;box-shadow:0 10px 28px rgba(90,80,160,.18);z-index:5}
.rf-panel .zhs{font-size:22px;margin-top:4px}
.rf-panel .vi{color:var(--muted,#667);margin-top:4px}
.rf-panel.m-han rt{visibility:hidden}
.rf-panel.m-kw .w:not(.kw):not(.ph) rt{visibility:hidden}
@media(max-width:700px){.rf-text{font-size:20px;padding:16px;line-height:2.2}.rf-panel{bottom:70px}}

.rf-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.rf-bar select{border:2px solid var(--line);border-radius:12px;padding:7px 10px;background:#fff;font:inherit}
.rf-bar .btn.on{background:#fde0e4;border-color:#f2a7b4;color:#b23a50}
.rf-status{background:#fffaf0;border:2px solid #f0c96a;border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:14px;line-height:1.7}
.sf.turn{background:#fff4d6;box-shadow:0 0 0 3px #f6dc94}
.sf.good{background:#d9f3e4}.sf.okk{background:#fff1c7}.sf.bad{background:#fde0e4}
.lg{padding:1px 8px;border-radius:6px;font-weight:600}.lg.good{background:#d9f3e4}.lg.okk{background:#fff1c7}.lg.bad{background:#fde0e4}

.dict{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.dict-dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-height:96px;overflow:auto}
.dict-dots button{min-width:30px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.dict-dots button.on{border-color:var(--p-dark);box-shadow:0 0 0 2px var(--p-soft)}
.dict-dots button.g{background:#d9f3e4}.dict-dots button.y{background:#fff1c7}.dict-dots button.r{background:#fde0e4}
.dict-ans{font-size:22px;line-height:1.7;background:var(--p-softer);border-radius:14px;padding:8px 12px;margin-top:6px}
.dk-ok{color:#1f7a4f}.dk-no{color:#c2334d;text-decoration:underline wavy #e88a9b;text-underline-offset:4px}
.dict-score{display:inline-block;font-weight:700;border-radius:10px;padding:3px 10px}
.dict-score.g{background:#d9f3e4;color:#1f7a4f}.dict-score.y{background:#fff1c7;color:#8a6408}.dict-score.r{background:#fde0e4;color:#b23a50}

.tr-src{font-size:22px;line-height:1.9;background:var(--p-softer);border-radius:14px;padding:10px 14px;margin-top:10px}
.tr-hint{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tr-ans{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;margin-top:10px}
.dict-dots button.t{background:#eef0ff}
.tr-all{max-height:340px;overflow:auto;line-height:2.1;font-size:20px}
.tr-all .sf.play{background:var(--p-soft);border-radius:6px}

.fill-in.ok{border-color:#2f9e6e;background:#d9f3e4}.fill-in.no{border-color:#e5536b;background:#fde0e4}

function makeMockDb(){
  const data={}; const subs=[];
  const notify=()=>subs.forEach(s=>s());
  const col=path=>({
    path, doc:id=>docRef(path+"/"+(id||Math.random().toString(36).slice(2,12))),
    add:async d=>{ const r=docRef(path+"/"+Math.random().toString(36).slice(2,12)); await r.set(d); return r; },
    orderBy(){return this;}, where(){return this;}, limit(){return this;},
    get:async()=>snap(path),
    onSnapshot(next){ const f=()=>next(snap(path)); subs.push(f); setTimeout(f,50); return ()=>{}; }
  });
  const snap=path=>{ const docs=Object.keys(data).filter(k=>k.startsWith(path+"/")&&k.split("/").length===path.split("/").length+1).map(k=>({id:k.split("/").pop(),exists:true,data:()=>data[k]})); return {docs,size:docs.length,empty:!docs.length}; };
  const docRef=p=>({id:p.split("/").pop(),path:p,get:async()=>({id:p.split("/").pop(),exists:!!data[p],data:()=>data[p]}),
    set:async d=>{data[p]=JSON.parse(JSON.stringify(d));notify();}, update:async d=>{data[p]=Object.assign({},data[p],d);notify();}, delete:async()=>{delete data[p];notify();},
    onSnapshot(next){ const f=()=>next({exists:!!data[p],data:()=>data[p]}); subs.push(f); setTimeout(f,50); return ()=>{}; }});
  return {doc:docRef,collection:col};
}

    :`<div class="acc-lock"><div class="ic">🔒</div><b>Cấp độ ${esc(lvName(curLevel))} cần được duyệt</b><div class="muted" style="margin:4px 0 10px">Gửi yêu cầu, <span class="zh">舒如天上星</span> duyệt xong là bạn vào học được. Video và bài đọc thì học ngay không cần duyệt.</div><button class="btn p" id="accReq">📩 Gửi yêu cầu học ${esc(LEVELS.find(l=>l.id===curLevel).name)}</button></div>`;
  if(!open){ g.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="ic">⏳</div>Các bài học ${esc(lvName(curLevel))} <b>sắp ra mắt</b>. Bạn vẫn có thể xem tài liệu bên dưới.</div>`; }
  else if(!ls.length){ g.innerHTML=lockBox+`<div class="empty" style="grid-column:1/-1"><div class="ic">📭</div>${lessonsState==="loading"?"Đang tải bài học…":"Chưa có bài học nào cho cấp độ này."}${canTeach()?`<br><button class="btn p sm" style="margin-top:10px" data-go="admin">＋ Soạn bài trong trang Quản trị</button>`:""}</div>`; }
  else {
    g.innerHTML=lockBox+`<div class="path">${ls.map((l,i)=>{ const n=doneSet(l.id).size, tot=stepCount(l); const cls=n>=tot?"done":n?"part":""; return `<div class="pl ${cls} ${l.status!=="pub"?"draft":""} ${ok?"":"locked"}"><div class="pl-dot">${ok?(n>=tot?"✓":i+1):"🔒"}</div>
      <div class="pl-card" ${ok?`data-go="lesson-${esc(l.id)}"`:""}><div style="flex:1;min-width:0"><div class="muted" style="font-size:12px;font-weight:700">BÀI ${i+1}${l.status!=="pub"?' · <span class="tag draft">Nháp</span>':""}</div><div class="pl-t zh">${esc(l.zh||"")}</div><div class="muted" style="font-size:13px">${esc(l.vi||"")}</div>
        <div class="pl-bar"><i style="width:${Math.round(n/tot*100)}%"></i></div><div class="muted" style="font-size:12px">${n}/${tot} bước</div></div>
        <span class="btn ${n?"":"p"} sm pl-go">${!ok?"🔒 Chưa mở":n>=tot?"Ôn lại":n?"Học tiếp →":"Bắt đầu →"}</span></div></div>`; }).join("")}</div>`;
    if(false){ g.innerHTML=ls.map((l,i)=>{ const n=doneSet(l.id).size; const cls=n>=stepCount(l)?"done":n?"part":""; return `<div class="lc ${cls} ${l.status!=="pub"?"draft":""}" data-l="${esc(l.id)}"><div class="ring">${i+1}</div><div class="nm zh">${esc(l.zh||"")}</div>${l.status!=="pub"?'<span class="tag draft">Nháp</span>':""}${popLesson===l.id?`<div class="lpop"><b>Bài ${i+1}</b><div class="zh">${esc(l.zh||"")}</div><div class="muted" style="font-size:13px">${esc(l.vi||"")}</div><div class="muted" style="font-size:13px;margin:4px 0 8px">Tiến độ: ${n} / ${stepCount(l)} bước</div><button class="btn p sm" data-go="lesson-${esc(l.id)}">${n?"Học tiếp":"Bắt đầu học"}</button></div>`:""}</div>`; }).join("");
    }
  }
  const aq=$("#accReq"); if(aq) aq.onclick=()=>requestLevel(curLevel);
  renderDocs();
}
document.addEventListener("click",e=>{ if(popLesson && !e.target.closest(".lc")){ popLesson=null; if(curView()==="course") renderCourse(); } });

/* ---------- Tài liệu ---------- */
function catOf(id){ return CATS.find(c=>c.id===id)||CATS[5]; }
function renderDocs(){
  $("#docLv").textContent=lvName(curLevel);
  const list=DOCS.filter(d=>d.level===curLevel);
  const counts={}; list.forEach(d=>counts[d.cat]=(counts[d.cat]||0)+1);
  $("#dfilter").innerHTML=`<button class="btn sm ${docCat==="all"?"on":""}" data-c="all">Tất cả (${list.length})</button>`+CATS.filter(c=>counts[c.id]).map(c=>`<button class="btn sm ${docCat===c.id?"on":""}" data-c="${c.id}">${c.ic} ${c.name} (${counts[c.id]})</button>`).join("");
  $("#dfilter").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ docCat=b.dataset.c; renderDocs(); });
  const shown=list.filter(d=>docCat==="all"||d.cat===docCat);
  const box=$("#docList");
  if(docsState==="off"){ box.innerHTML=`<div class="empty"><div class="ic">🔌</div>Không kết nối được kho tài liệu ở chế độ xem này. Hãy mở trang khi đã đăng nhập.</div>`; return; }
  if(docsState==="loading"){ box.innerHTML=`<div class="empty">Đang tải tài liệu…</div>`; return; }
  if(docsState==="slow"||docsState==="err"){ box.innerHTML=`<div class="empty"><div class="ic">⏳</div>Chưa tải được danh sách tài liệu. Hãy thử lại sau ít phút.</div>`; return; }
  if(!shown.length){ box.innerHTML=`<div class="empty"><div class="ic">📂</div>Chưa có tài liệu nào cho cấp độ này.${ADM()&&ASSETS?'<br><button class="btn p sm" style="margin-top:10px" id="upBtn2">＋ Tải tài liệu đầu tiên</button>':""}</div>`; const b=$("#upBtn2"); if(b) b.onclick=()=>openUpload(curLevel); return; }
  box.innerHTML=`<div class="dlist">${shown.map(docCard).join("")}</div>`;
  bindDocActs(box);
}
function docCard(d){
  const c=catOf(d.cat);
  return `<div class="doc"><div class="ic">${c.ic}</div><div style="flex:1;min-width:0"><div class="tt">${esc(d.title)}</div>
    <div class="meta">${c.name} · ${esc(lvName(d.level))} · ${fmtSize(d.size||0)} · ${fmtDate(d.createdAt)}${d.srtId?" · có phụ đề":""}</div>
    ${d.note?`<div class="note">${esc(d.note)}</div>`:""}
    <div class="acts"><button class="btn sm" data-view="${esc(d.id)}">👁 Xem</button>${DL||SB||location.protocol==="file:"?`<button class="btn sm" data-dl="${esc(d.id)}">⬇ Tải về</button>`:""}${d.srtId?`<button class="btn sm p" data-shadow="${esc(d.id)}">🎧 Luyện shadowing</button>`:""}${canTeach()&&ASSETS?`<button class="btn sm" data-edoc="${esc(d.id)}">✏️ Sửa · đổi file</button><button class="btn sm red" data-del="${esc(d.id)}">🗑 Xóa</button>`:""}</div></div></div>`;
}
function bindDocActs(root){
  root.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>viewDoc(DOCS.find(d=>d.id===b.dataset.view)));
  root.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>downloadDoc(DOCS.find(d=>d.id===b.dataset.dl)));
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>confirmDelDoc(DOCS.find(d=>d.id===b.dataset.del)));
  root.querySelectorAll("[data-edoc]").forEach(b=>b.onclick=()=>{ const d=DOCS.find(x=>x.id===b.dataset.edoc); if(d) openUpload(d.level,d); });
  root.querySelectorAll("[data-shadow]").forEach(b=>b.onclick=()=>{ SH.src="doc:"+b.dataset.shadow; pendingStep=5; location.hash="lesson-"+BUILTIN.id; if(curView()==="lesson") go(5); });
}
$("#upBtn").onclick=()=>openUpload(curLevel);

/* ---------- Modal chung ---------- */
function modal(html, wide){
  const root=$("#modalRoot"); root.innerHTML=`<div class="mback"><div class="modal ${wide?"wide":""}">${html}</div></div>`;
  const back=root.querySelector(".mback");
  back.addEventListener("mousedown",e=>{ if(e.target===back) closeModal(); });
  root.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  return root.querySelector(".modal");
}
function closeModal(){ const v=$("#modalRoot video"); if(v) v.pause(); $("#modalRoot").innerHTML=""; }
function confirmBox(title, msg, okText, onOk){
  const m=modal(`<h3>${esc(title)}<button class="x" data-close>×</button></h3><p>${msg}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>Hủy</button><button class="btn p" id="cfOk">${esc(okText)}</button></div>`);
  m.querySelector("#cfOk").onclick=async()=>{ m.querySelector("#cfOk").disabled=true; await onOk(); closeModal(); };
}

/* ---------- Xem / tải / xóa ---------- */
function viewDoc(d){
  if(!d) return; const url=blobUrl(d.assetId); const ct=d.contentType||"";
  let body="";
  if(ct==="application/pdf") body=`<iframe src="${url}" title="${esc(d.title)}"></iframe><div class="muted" style="font-size:12px;margin-top:6px">Nếu tài liệu không hiện, hãy bấm “Tải về” để mở bằng máy của bạn.</div>`;
  else if(ct.startsWith("image/")) body=`<img src="${url}" alt="${esc(d.title)}">`;
  else if(ct.startsWith("video/")) body=`<video src="${url}" controls playsinline></video>`;
  else if(ct.startsWith("audio/")) body=`<audio src="${url}" controls style="width:100%"></audio>`;
  else if(!ct.startsWith("text/")&&ct!=="application/json") body=`<div class="empty"><div class="ic">📄</div>File này xem tốt nhất sau khi tải về máy.</div>`;
  else body=`<pre id="txtView">Đang tải…</pre>`;
  const m=modal(`<h3><span>${catOf(d.cat).ic} ${esc(d.title)}</span><button class="x" data-close>×</button></h3><div class="viewer">${body}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap">${d.srtId?`<button class="btn p" id="vSh">🎧 Luyện shadowing</button>`:""}${DL||SB||location.protocol==="file:"?`<button class="btn" id="vDl">⬇ Tải về</button>`:""}<button class="btn" data-close>Đóng</button></div>`, true);
  const t=m.querySelector("#txtView"); if(t) fetch(url).then(r=>r.text()).then(x=>t.textContent=x).catch(()=>t.textContent="Không đọc được nội dung.");
  const b=m.querySelector("#vDl"); if(b) b.onclick=()=>downloadDoc(d);
  const s=m.querySelector("#vSh"); if(s) s.onclick=()=>{ closeModal(); SH.src="doc:"+d.id; pendingStep=5; location.hash="lesson-"+BUILTIN.id; if(curView()==="lesson") go(5); };
}
async function downloadDoc(d){
  if(!d) return;
  if(SB){ const a=document.createElement("a"); a.href=blobUrl(d.assetId)+"?download="+encodeURIComponent(d.fileName||d.title); a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove(); return; }
  try{
    const r=await fetch(blobUrl(d.assetId)); const b=await r.blob();
    if(!DL){ toast("Chế độ thử: tải về hoạt động trên trang đã đăng"); return; }
    await DL.save({filename:d.fileName||(d.title+".pdf"), data:b}); toast("Đã tải về");
  }catch(e){
    if(e&&e.code==="declined") return;
    if(e&&e.code==="rejected_extension"){ toast("Loại file này không tải về được từ trang này"); return; }
    if(e&&e.code==="rate_limited"){ toast("Đang có một hộp thoại tải về, hãy thử lại sau"); return; }
    toast("Không tải về được. Hãy thử lại.");
  }
}
function confirmDelDoc(d){
  if(!d) return;
  confirmBox("Xóa tài liệu?", `Tài liệu <b>${esc(d.title)}</b> sẽ bị xóa vĩnh viễn với tất cả học viên. Không thể hoàn tác.`, "Xóa vĩnh viễn", async()=>{
    try{ await DB.doc("docs/"+d.id).delete(); }catch(e){ toast("Không xóa được: "+(e.message||e.code)); return; }
    try{ await ASSETS.delete(d.assetId); if(d.srtId) await ASSETS.delete(d.srtId); }catch(e){}
    toast("Đã xóa tài liệu");
  });
}

/* ---------- Tải lên ---------- */
const TYPE_BY_EXT_SB={doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",ppt:"application/vnd.ms-powerpoint",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",xls:"application/vnd.ms-excel",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",mp3:"audio/mpeg",m4a:"audio/mp4",wav:"audio/wav",zip:"application/zip"};
const TYPE_BY_EXT={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",mp4:"video/mp4",webm:"video/webm",txt:"text/plain",md:"text/markdown",csv:"text/csv",json:"application/json"};
function extOf(n){ const m=/\.([a-z0-9]+)$/i.exec(n||""); return m?m[1].toLowerCase():""; }
function unsupportedMsg(ext){
  if(["doc","docx","ppt","pptx","xls","xlsx","odt"].includes(ext)) return "File Word/PowerPoint/Excel chưa tải lên trực tiếp được. Hãy lưu thành PDF (File → Lưu thành/Export → PDF) rồi tải lên.";
  if(["mp3","m4a","wav","aac","ogg"].includes(ext)) return "File âm thanh chưa tải lên trực tiếp được. Hãy chuyển sang MP4 (video có tiếng) rồi tải lên.";
  if(["mov","avi","mkv"].includes(ext)) return "Video cần ở dạng MP4 hoặc WebM.";
  return "Loại file này chưa được hỗ trợ. Hỗ trợ: PDF, ảnh (JPG, PNG, WebP, GIF), video (MP4, WebM), văn bản (TXT, MD, CSV).";
}
function guessCat(ct){ if(ct==="application/pdf") return "book"; if(ct.startsWith("video/")) return "video"; if(ct.startsWith("image/")) return "img"; return "other"; }
function openUpload(level, E){
  if(!ASSETS||!DB){ toast("Chỉ quản trị viên mới tải tài liệu lên được"); return; }
  let file=null, srt=null, dropSrt=false;
  const m=modal(`<h3>${E?"✏️ Sửa tài liệu / đổi file":"📤 Tải tài liệu lên"}<button class="x" data-close>×</button></h3>
    <div id="upMsg"></div>
    <div class="drop" id="upDrop"><div style="font-size:30px">📄</div><b id="upName">${E?"Bấm hoặc kéo thả file mới để thay file cũ":"Kéo thả file vào đây hoặc bấm để chọn"}</b><div class="muted" style="font-size:12px">PDF, ảnh, video MP4/WebM, TXT/MD/CSV · tối đa 20 MB</div><input type="file" id="upFile" hidden accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.mp4,.webm,.txt,.md,.csv,.json"></div>
    <div id="upCur" class="lrow ${E?"":"hidden"}" style="margin-top:8px"><div class="tt"><div class="muted" style="font-size:12px" id="upCurL">${E?"File hiện tại":"File đã chọn"}</div><b id="upCurN"></b></div><button class="btn sm red" id="upClr" type="button">✕ Bỏ file này</button></div>
    <div class="fld" id="srtFld" style="margin-top:12px" class="hidden"><label>Phụ đề cho video (.srt / .vtt) <span class="muted">· không bắt buộc, có thì học viên luyện shadowing được</span></label><input type="file" id="upSrt" accept=".srt,.vtt,.txt"><div id="upSrtCur" class="hidden" style="margin-top:6px;display:flex;gap:8px;align-items:center"><span class="muted" style="font-size:13px" id="upSrtCurN">Đang có phụ đề</span><button class="btn sm red" id="upSrtClr" type="button">✕ Xóa phụ đề</button></div></div>
    <div class="fld" style="margin-top:12px"><label>Tên tài liệu</label><input type="text" id="upTitle" maxlength="160" placeholder="Ví dụ: Đề thi thử HSK 1 – Đề số 1"></div>
    <div class="row2"><div class="fld"><label>Loại</label><select id="upCat">${CATS.map(c=>`<option value="${c.id}">${c.ic} ${c.name}</option>`).join("")}</select></div>
    <div class="fld"><label>Cấp độ</label><select id="upLv">${LEVELS.map(l=>`<option value="${l.id}" ${l.id===level?"selected":""}>${esc(l.full)}</option>`).join("")}</select></div></div>
    <div class="fld"><label>Ghi chú cho học viên <span class="muted">(không bắt buộc)</span></label><input type="text" id="upNote" maxlength="240" placeholder="Ví dụ: Làm trong 40 phút, đáp án ở trang cuối"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">${E?`<button class="btn red" id="upDel" style="margin-right:auto">🗑 Xóa tài liệu</button>`:""}<button class="btn" data-close>Hủy</button><button class="btn p" id="upGo">${E?"💾 Lưu thay đổi":"Tải lên"}</button></div>`);
  m.querySelector("#srtFld").classList.add("hidden");
  const curBox=()=>{ const has=file||(E&&!file); m.querySelector("#upCur").classList.toggle("hidden",!file&&!E); m.querySelector("#upCurL").textContent=file?"File đã chọn":"File hiện tại"; m.querySelector("#upCurN").textContent=file?`${file.f.name} (${fmtSize(file.f.size)})`:E?`${E.fileName||E.title} (${fmtSize(E.size||0)})`:""; m.querySelector("#upClr").classList.toggle("hidden",!file); return has; };
  const vidNow=()=>((file&&file.type)||(E&&!file&&E.contentType)||"").startsWith("video/");
  const srtBox=()=>{ m.querySelector("#srtFld").classList.toggle("hidden",!vidNow()); const sc=m.querySelector("#upSrtCur"); const show=E&&E.srtId&&!dropSrt&&!srt; sc.classList.toggle("hidden",!show); sc.style.display=show?"flex":"none"; };
  if(E){ m.querySelector("#upTitle").value=E.title||""; m.querySelector("#upCat").value=E.cat||"other"; m.querySelector("#upNote").value=E.note||""; curBox(); srtBox();
    m.querySelector("#upDel").onclick=()=>{ closeModal(); confirmDelDoc(E); }; }
  m.querySelector("#upClr").onclick=e=>{ e.stopPropagation(); file=null; m.querySelector("#upFile").value=""; m.querySelector("#upName").textContent=E?"Bấm hoặc kéo thả file mới để thay file cũ":"Kéo thả file vào đây hoặc bấm để chọn"; curBox(); srtBox(); };
  m.querySelector("#upSrtClr").onclick=()=>{ dropSrt=true; srtBox(); toast("Phụ đề sẽ bị xóa khi bấm Lưu"); };
  const msg=t=>m.querySelector("#upMsg").innerHTML=t?`<div class="err">${esc(t)}</div>`:"";
  const pick=f=>{
    msg(""); const ext=extOf(f.name); const type=TYPE_BY_EXT[ext];
    if(!type&&!(SB_ON&&TYPE_BY_EXT_SB[ext])){ file=null; m.querySelector("#upName").textContent="Kéo thả file vào đây hoặc bấm để chọn"; msg(unsupportedMsg(ext)); return; }
    if(SB_ON&&!type&&TYPE_BY_EXT_SB[ext]){ file={f,type:TYPE_BY_EXT_SB[ext]}; m.querySelector("#upName").textContent="✅ "+f.name+" ("+fmtSize(f.size)+")"; if(!m.querySelector("#upTitle").value) m.querySelector("#upTitle").value=f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," "); m.querySelector("#upCat").value=ext.startsWith("doc")||ext.startsWith("ppt")?"book":"other"; curBox(); srtBox(); return; }
    if(f.size>(SB_ON?50:20)*1024*1024){ file=null; msg("File lớn hơn 20 MB. Hãy nén hoặc chia nhỏ file rồi tải lên."); return; }
    file={f,type}; m.querySelector("#upName").textContent="✅ "+f.name+" ("+fmtSize(f.size)+")";
    if(!m.querySelector("#upTitle").value) m.querySelector("#upTitle").value=f.name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ");
    m.querySelector("#upCat").value=guessCat(type);
    m.querySelector("#srtFld").classList.toggle("hidden",!type.startsWith("video/"));
    curBox(); srtBox();
  };
  const drop=m.querySelector("#upDrop"), inp=m.querySelector("#upFile");
  drop.onclick=()=>inp.click(); inp.onchange=()=>{ if(inp.files[0]) pick(inp.files[0]); };
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");}; drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over"); if(e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]);};
  m.querySelector("#upSrt").onchange=e=>{ srt=e.target.files[0]||null; srtBox(); };
  m.querySelector("#upGo").onclick=async()=>{
    if(E){ const title=m.querySelector("#upTitle").value.trim(); if(!title){ msg("Hãy nhập tên tài liệu."); return; }
      const go=m.querySelector("#upGo"); go.disabled=true; go.textContent=file?"Đang tải file mới…":"Đang lưu…";
      try{ const d=Object.assign({},E); delete d.id; Object.assign(d,{title,cat:m.querySelector("#upCat").value,level:m.querySelector("#upLv").value,note:m.querySelector("#upNote").value.trim(),updatedAt:Date.now()});
        const old=[];
        if(file){ const res=await ASSETS.upload(file.f,{type:file.type}); old.push(E.assetId); Object.assign(d,{assetId:res.id,contentType:res.contentType,size:res.sizeBytes,fileName:file.f.name}); }
        const isVid=(d.contentType||"").startsWith("video/");
        if(srt&&isVid){ const txt=await srt.text(); const sr=await ASSETS.upload(new Blob([txt],{type:"text/plain"}),{type:"text/plain"}); if(E.srtId) old.push(E.srtId); d.srtId=sr.id; }
        else if((dropSrt||!isVid)&&E.srtId){ old.push(E.srtId); d.srtId=null; }
        await DB.doc("docs/"+E.id).set(d);
        for(const id of old){ try{ if(id) await ASSETS.delete(id); }catch(e){} }

      msg(map[code]||("Không tải lên được"+(e&&e.message?": "+e.message:"")+"."));

const LF_HEAD=/^\s*(第\s*[一二三四五六七八九十百零\d]+\s*[课課]|b[àa]i\s*(h[ọo]c\s*)?\d+|lesson\s*\d+|unit\s*\d+|제\s*\d+\s*과|lektion\s*\d+|lecci[óo]n\s*\d+|le[çc]on\s*\d+|урок\s*\d+)(?![\p{L}\d])[\s:：.\-–—]*/iu;
const PY_WORD=/^[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüê'’·\-]+$/;
const PY_SYL=/(?:zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?(?:iang|iong|uang|ang|eng|ing|ong|uai|iao|ian|uan|van|ai|ei|ao|ou|an|en|in|un|vn|ia|ie|iu|ua|uo|ui|ve|ue|er|a|o|e|i|u|v)(?:r(?![aeiouv]))?/g;
const pyBare=w=>String(w).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ü/g,"v").toLowerCase().replace(/[’'·\-]/g,"");

function pySylCount(w){ return (pyBare(w).match(PY_SYL)||[]).length||1; }
const isPyLine=l=>!hasHan(l)&&!VI_RE.test(l)&&/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(l)&&l.split(/\s+/).every(isPinyinWord);
function lfSecOf(l){ const t=l.replace(/^[#\s]*([一二三四五六七八九十\d]+[、.．)）]\s*|[IVX]+[.)]\s*)?/,"").replace(/[\s:：]+$/,"").replace(/^[【\[(（]|[】\])）]$/g,"").trim(); if(t.length>30) return null; for(const [k,re] of LF_SEC) if(re.test(t)) return k; return null; }
function splitLessonsText(raw){
  const lines=String(raw).replace(/\r/g,"").split("\n"); const out=[]; let cur=null;
  lines.forEach(l=>{ if(LF_HEAD.test(l)&&l.trim().length<=60){ cur={head:l.trim(),lines:[]}; out.push(cur); } else { if(!cur){ cur={head:"",lines:[]}; out.push(cur); } cur.lines.push(l); } });

function lfVocab(lines, lang){
  const out=[]; let e=null; const cjk=CJK(lang)||lang==="ko";
  const foreignRe=lang==="ko"?/[가-힯]/:/[㐀-鿿぀-ヿ]/;
  const push=()=>{ if(e&&e.w) out.push(e); e=null; };
  lines.forEach(l0=>{ let l=l0.trim().replace(/^\d+\s*[.、)）]\s*/,""); if(!l) return;
    if(l.includes("|")||l.includes("\t")){ push(); const a=l.split(/\s*[|\t]\s*/); e={w:a[0],py:a[1]||"",vi:a[2]||"",tp:a[3]||""}; if(a.length===2){ if(isViLine(a[1])||!cjk){ e.vi=a[1]; e.py=""; } } push(); return; }
    if(cjk){
      if(foreignRe.test(l)){
        const m=l.match(lang==="ko"?/^([가-힯]+(?:\s[가-힯]+)?)\s*(.*)$/:/^([㐀-鿿぀-ヿ…（）()]+)\s*(.*)$/);
        if(!m){ if(e&&!e.ex){ e.ex=l; } return; }
        push(); e={w:m[1].replace(/[（(].*$/,""),py:"",vi:"",tp:""}; let rest=m[2].trim();
        const tpm=rest.match(/[（(]\s*([a-zA-Z.\/]+|[一-鿿]{1,3}|danh từ|động từ|tính từ|phó từ|lượng từ|đại từ|giới từ|liên từ|trợ từ)\s*[）)]/i); if(tpm){ e.tp=tpm[1]; rest=rest.replace(tpm[0]," ").trim(); }
        const ws=rest.split(/\s+/); let k=0; const py=[]; const need=[...e.w].filter(c=>/[㐀-鿿]/.test(c)).length||1; let syl=0;
        while(k<ws.length&&ws[k]&&syl<need&&!VI_RE.test(ws[k])&&isPinyinWord(ws[k])&&(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/.test(ws[k])||py.length)){ py.push(ws[k]); syl+=pySylCount(ws[k]); k++; }

        return; }
      if(e&&!e.py&&isPyLine(l)){ e.py=l; return; }
      if(e&&!e.vi){ e.vi=l.replace(/^[:：\-–—=]\s*/,""); return; }
      if(e&&e.ex&&!e.exVi){ e.exVi=l; return; }
      return;
    }
    // ngôn ngữ chữ cái: "word – nghĩa", "word: nghĩa", "word /ipa/ nghĩa"
    const m=l.match(/^(.+?)\s*(\/[^\/]+\/|\[[^\]]+\])?\s*(?:\s[-–—=:]\s|[:：]\s*|\s{2,})(.+)$/);
    if(m&&!isViLine(m[1])){ push(); e={w:m[1].trim(),py:(m[2]||"").replace(/[\/\[\]]/g,""),vi:m[3].trim(),tp:""}; push(); return; }
    if(!isViLine(l)){ push(); e={w:l,py:"",vi:"",tp:""}; return; }
    if(e&&!e.vi){ e.vi=l; push(); }
  });
  push();
  return out.filter(x=>x.w&&[...x.w].length<=30);
}
function lfDialogue(lines, lang){
  const out=[], names={}; let order=[]; const cjk=CJK(lang);
  const isForeign=l=>cjk?hasHan(l)||/[぀-ヿ]/.test(l):lang==="ko"?/[가-힯]/.test(l):!isViLine(l);
  lines.forEach(l0=>{ const l=l0.trim(); if(!l) return;
    if(isPyLine(l)) return;
    const sp=l.match(/^([^\s:：|]{1,14}?)\s*[:：]\s*(.+)$/);
    if(sp&&isForeign(sp[2])&&!/^https?$/i.test(sp[1])){ let n=sp[1]; if(!(n in names)){ order.push(n); names[n]=order.length%2?"A":"B"; }
      const a=sp[2].split("|"); out.push({s:names[n],zh:a[0].trim(),vi:(a[1]||"").trim()}); return; }
    if(l.includes("|")&&isForeign(l)){ const a=l.split("|"); out.push({s:out.length%2?"B":"A",zh:a[0].trim(),vi:(a[1]||"").trim()}); return; }
    if(isForeign(l)){ out.push({s:out.length&&!order.length?(out[out.length-1].s==="A"?"B":"A"):"A",zh:l,vi:""}); return; }
    if(out.length&&!out[out.length-1].vi){ out[out.length-1].vi=l.replace(/^[^\s:：]{1,20}\s*[:：]\s*/,""); }
  });
  return {dlg:out, names:order};

function parseLessonText(raw, lang, fileName){
  const res={zh:"",vi:"",voc:[],dlg:[],gra:[],cul:[],names:[]};
  let lines=String(raw).replace(/\r/g,"").split("\n");
  const sec={pre:[],voc:[],dlg:[],gra:[],cul:[],skip:[]}; let cur="pre";
  lines.forEach(l=>{ const k=lfSecOf(l.trim()); if(k){ cur=k; return; } sec[cur].push(l); });
  // tiêu đề
  const pre=sec.pre.map(l=>l.trim()).filter(Boolean);
  let head=pre.find(l=>LF_HEAD.test(l));
  if(head){ const t=head.replace(LF_HEAD,"").trim(); if(t) res.zh=t; }
  const found=Object.keys(sec).some(k=>k!=="pre"&&k!=="skip"&&sec[k].some(l=>l.trim()));
  if(!found){ // không có tiêu đề phần: tự đoán theo dạng dòng
    const sp=pre.filter(l=>/^[^\s:：]{1,14}\s*[:：]/.test(l)); const others=pre.filter(l=>!sp.includes(l));
    sec.dlg=sp.length>=2?pre.slice(pre.indexOf(sp[0])):[]; sec.voc=sp.length>=2?pre.slice(0,pre.indexOf(sp[0])):others;
  }
  for(const l of pre){ if(LF_HEAD.test(l)) continue; if(!res.zh&&!isViLine(l)&&[...l].length<=40&&(found||!/[:：]/.test(l))){ res.zh=l; continue; } if(res.zh&&!res.vi&&isViLine(l)&&l.length<=80){ res.vi=l; break; } if(res.zh) break; }
  if(!res.zh) res.zh=(fileName||"").replace(/\.[^.]+$/,"").replace(LF_HEAD,"").replace(/[_-]+/g," ").trim().slice(0,60);
  res.voc=lfVocab(sec.voc,lang).map(v=>{ if(!v.py&&lang==="zh") v.py=autoPy(v.w,"zh"); return v; });
  const d=lfDialogue(sec.dlg,lang); res.dlg=d.dlg; res.names=d.names;
  res.graTxt=sec.gra.join("\n").replace(/\n{3,}/g,"\n\n").trim();
  res.culTxt=sec.cul.join("\n").replace(/\n{3,}/g,"\n\n").trim();
  return res;
}
function lessonFromParsed(r, level, order){
  const nA=r.names[0]||"", nB=r.names[1]||"";
  return {level, order, status:"draft", zh:(r.zh||"Bài mới").slice(0,80), vi:(r.vi||"").slice(0,120),
    speakers:{A:{name:nA.slice(0,40)||"A",av:"🧑🏻"},B:{name:nB.slice(0,40)||"B",av:"👧🏻"}},

}

const lexGet=w=>LEX[w]||LEX[String(w).toLowerCase()];
function tok(text, lang){
  lang=lang||CUR_LANG; const out=[];
  if(!CJK(lang)){
    const parts=String(text).match(/\p{L}[\p{L}\p{M}'’\-]*|\s+|[^\p{L}\s]+/gu)||[];
    for(let i=0;i<parts.length;){
      let hit=0;
      if(isWordy(parts[i])) for(let n=Math.min(7,parts.length-i);n>=3;n-=2){ const s=parts.slice(i,i+n).join(""); if(isWordy(parts[i+n-1])&&lexGet(s)){ hit=n; break; } }
      if(hit){ out.push(parts.slice(i,i+hit).join("")); i+=hit; } else { out.push(parts[i]); i++; }
    }
    return out;
  }
  const chars=[...String(text)]; let i=0;
  while(i<chars.length){
    const c=chars[i];
    if(isPunct(c)){ out.push(c); i++; continue; }
    let hit=null; for(let n=Math.min(6,chars.length-i);n>=2;n--){ const s=chars.slice(i,i+n).join(""); if(LEX[s]){ hit=s; break; } }
    if(hit){ out.push(hit); i+=[...hit].length; continue; }
    if(!hasHan(c)){ let j=i; while(j<chars.length&&!hasHan(chars[j])&&!isPunct(chars[j])) j++; out.push(chars.slice(i,j).join("")); i=j; continue; }
    out.push(c); i++;
  }
  return out;
}

}

    fc.querySelector(".back").innerHTML=`<div class="py">${esc(pyOf(w))}</div><div class="vi">${esc(meanOf(w))}</div>${ex[0]?`<div class="zh" style="font-size:18px;margin-top:6px">${esc(ex[0])}</div><div class="muted" style="font-size:13px">${esc(ex[1])}</div>`:""}`;

    $("#gr").innerHTML=`<button class="btn sm" id="fs">🔊 Nghe</button>${CUR_LANG==="zh"&&hasHan(w)?` <button class="btn sm" id="fd">✍ Xem nét & bộ thủ</button>`:""}`; $("#fs").onclick=e=>{ e.stopPropagation(); say(w); }; if($("#fd")) $("#fd").onclick=e=>{ e.stopPropagation(); wordDetail(w,{py:pyOf(w),vi:meanOf(w),ex:ex[0],exVi:ex[1]}); };

function rMatch(el){

  if(P.length<2){ el.innerHTML=`<div class="empty">Chưa đủ dữ liệu để tạo bài nối câu.</div>`; markDone(8); return; }
  const L=P.map((p,i)=>({t:p[0],i})), R=shuffle(P.map((p,i)=>({t:p[1],i})));
  const colors=["#5b9bd5","#f2a65a","#8c7ae6","#2f9e6e"]; let selL=null; const pair={};
  el.innerHTML=guide("Bấm một câu bên trái, rồi bấm câu đáp phù hợp bên phải.")+`<div class="match"><div class="col" id="cl"></div><div class="col" id="cr"></div></div><div style="margin-top:12px"><button class="btn p" id="ck">✔ Kiểm tra</button> <button class="btn" id="rs">↺ Làm lại</button></div><div id="fb"></div>`;

    $("#cl").innerHTML=L.map(l=>{ const c=pair[l.i]!=null?colors[l.i]:null; return `<button class="mi zh ${selL===l.i?"sel":""} ${st?(R[pair[l.i]]&&R[pair[l.i]].i===l.i?"ok":"no"):""}" data-l="${l.i}">${c?`<span class="tagn" style="background:${c}">${l.i+1}</span>`:""}${esc(l.t)}</button>`; }).join("");
    $("#cr").innerHTML=R.map((r,k)=>{ const li=Object.keys(pair).find(x=>pair[x]===k); return `<button class="mi zh" data-r="${k}">${li!=null?`<span class="tagn" style="background:${colors[li]}">${+li+1}</span>`:""}${esc(r.t)}</button>`; }).join("");
    $("#cl").querySelectorAll(".mi").forEach(b=>b.onclick=()=>{ selL=+b.dataset.l; say(L[selL].t); paint(); });

  }
  paint();

}
/* 10 & 13. Trắc nghiệm tự tạo */
function genMCQ(n){
  const vs=shuffle(V()); const Q=[]; const kinds=["mean","word","py"]; let k=0;
  for(const v of vs){ if(Q.length>=n) break; const others=shuffle(V().filter(x=>x.w!==v.w)).slice(0,2); if(others.length<2) break;
    const kind=kinds[k++%3];
    if(kind==="mean") Q.push({q:`“<span class="zh">${esc(v.w)}</span>” nghĩa là gì?`,o:shuffle([v.vi,...others.map(x=>x.vi)]),a:v.vi});
    else if(kind==="word") Q.push({q:`Chọn ${CUR_LANG==="zh"||CUR_LANG==="ja"?"chữ Hán":"từ"} có nghĩa “${esc(v.vi)}”:`,o:shuffle([v.w,...others.map(x=>x.w)]),a:v.w,zh:true});
    else if(v.py&&others.every(x=>x.py&&x.py!==v.py)) Q.push({q:`${CUR_LANG==="zh"?"Pinyin":"Phiên âm"} của “<span class="zh">${esc(v.w)}</span>” là:`,o:shuffle([v.py,...others.map(x=>x.py)]),a:v.py});
    else Q.push({q:`“<span class="zh">${esc(v.w)}</span>” nghĩa là gì?`,o:shuffle([v.vi,...others.map(x=>x.vi)]),a:v.vi}); }
  const d=shuffle(DLG().filter(x=>x.vi))[0];
  if(d&&Q.length<n+1){ const others=shuffle(DLG().filter(x=>x.vi&&x.vi!==d.vi)).slice(0,2).map(x=>x.vi); if(others.length===2) Q.push({q:`“<span class="zh">${esc(d.zh)}</span>” nghĩa là:`,o:shuffle([d.vi,...others]),a:d.vi}); }
  return Q;
}
function mcq(el,Q,stepIdx,isTest){
  const ans={};
  el.innerHTML+=Q.map((q,i)=>`<div class="ex-item"><div><b>${i+1}.</b> ${q.q}</div><div class="opts">${q.o.map((o,k)=>`<button class="btn sm opt ${q.zh?"zh":""}" style="${q.zh?"font-size:17px":""}" data-i="${i}" data-k="${k}">${esc(o)}</button>`).join("")}</div></div>`).join("")+(isTest?`<button class="btn p" id="sub">📤 Nộp bài</button>`:"")+`<div id="fb"></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i,k=+b.dataset.k; if(isTest&&el.dataset.sub) return; ans[i]=k;
    b.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.remove("ok","no","on"));
    if(isTest){ b.classList.add("on"); return; }
    const ai=Q[i].o.indexOf(Q[i].a); b.classList.add(k===ai?"ok":"no"); if(k!==ai) b.parentElement.children[ai].classList.add("ok");
    if(Object.keys(ans).length===Q.length){ const s=Q.filter((q,j)=>ans[j]===q.o.indexOf(q.a)).length; $("#fb").innerHTML=`<div class="fb ${s===Q.length?"ok":"no"}">Bạn đúng ${s}/${Q.length} câu.</div>`; if(s>=Q.length-1) markDone(stepIdx); } });
  if(isTest) $("#sub").onclick=()=>{ if(Object.keys(ans).length<Q.length){ toast("Bạn còn câu chưa trả lời"); return; } el.dataset.sub=1; let s=0;
    Q.forEach((q,i)=>{ const row=el.querySelectorAll(".ex-item")[i].querySelectorAll(".opt"); const ai=q.o.indexOf(q.a); row[ai].classList.add("ok"); if(ans[i]!==ai) row[ans[i]].classList.add("no"); else s++; });
    const pct=Math.round(s/Q.length*100);
    $("#fb").innerHTML=`<div class="fb ${pct>=80?"ok":"no"}" style="text-align:center;font-size:18px">${pct>=80?"🏆":"💪"} Điểm: ${s}/${Q.length} (${pct}%)<br><span style="font-size:14px;font-weight:500">${pct>=80?"Bạn đã hoàn thành bài học!":"Cần đạt 80% để hoàn thành bài. Ôn lại rồi làm lại nhé."}</span><br><button class="btn sm" id="redo" style="margin-top:8px">↺ Làm lại</button></div>`;
    $("#redo").onclick=()=>go(cur); if(pct>=80) markDone(stepIdx); $("#sub").disabled=true; };
}

function safeUrl(u){ u=String(u||"").trim(); if(/^\+?\d[\d\s.]{7,}$/.test(u)) return "https://zalo.me/"+u.replace(/[^\d]/g,""); if(!/^https?:\/\//i.test(u)) { if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(u)) u="https://"+u; else return ""; } try{ const x=new URL(u); return (x.protocol==="https:"||x.protocol==="http:")?x.href:""; }catch(e){ return ""; } }
function profileData(){ const P=Object.assign({},DEFAULT_PROFILE,PROFILE||{}); if(PROFILE&&PROFILE.bio&&!PROFILE.slogan) P.slogan=PROFILE.bio; if(Array.isArray(P.stats)) P.stats=P.stats.map(x=>Array.isArray(x)?x:[(x&&x.l)||"",(x&&x.v)||""]); if(!Array.isArray(P.stats)||P.stats.length!==4) P.stats=DEFAULT_PROFILE.stats; return P; }

function dbErrMsg(e){ const m0=String((e&&(e.message||e.code))||e||""); setTimeout(()=>{ sbDiag().then(t=>{ if(!t) return; document.querySelectorAll("#modalRoot .err").forEach(el=>{ if(!el.querySelector(".diag")) el.insertAdjacentHTML("beforeend",`<div class="diag" style="font-size:12px;margin-top:6px;opacity:.85">🔍 ${esc(t)}</div>`); }); }); },50); return dbErrMsg2(m0); }
function dbErrMsg2(m){ const raw=m?` (Chi tiết: ${m.slice(0,160)})`:""; if(/row-level|permission|policy|not allowed|forbidden|denied|invalid_argument/i.test(m)) return "Máy chủ từ chối lưu: tài khoản chưa có quyền ghi."+raw; if(/does not exist|relation/i.test(m)) return "Cơ sở dữ liệu chưa được cài: hãy chạy file supabase-setup.sql trong Supabase."; if(/size|large|quota/i.test(m)) return "Dữ liệu hoặc file quá lớn."; if(/fetch|network|failed to/i.test(m)) return "Mất kết nối mạng, hãy thử lại."; return "Không lưu được"+(m?" ("+m.slice(0,140)+")":"")+". Hãy thử lại."; }

let HW_LOAD=null;
function loadHanziWriter(){
  if(window.HanziWriter) return Promise.resolve(true);
  if(HW_LOAD) return HW_LOAD;
  HW_LOAD=new Promise(res=>{ const sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"; sc.onload=()=>res(true); sc.onerror=()=>res(false); document.head.appendChild(sc); });
  return HW_LOAD;
}
function wordDetail(w, info, container){
  info=info||{}; const chars=[...w].filter(hasHan); let sel=0; let writer=null;
  const html=(container?"":`<h3><span>✍ Học sâu từng chữ</span><button class="x" data-close>×</button></h3>`)+`
    <div class="wd-top"><div class="wd-big zh"></div><div><div class="wd-py"></div><div style="font-size:17px" id="wdVi"></div></div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0"><button class="btn sm p" id="wdSay">🔊 Nghe</button><button class="btn sm" id="wdSlow">🐢 Chậm</button><button class="btn sm dark" id="wdSave"></button>
      <a class="btn sm" style="text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://hanzii.net/search/word/${encodeURIComponent(w)}">Tra Hanzii ↗</a></div>
    <div class="muted" style="font-size:13px;font-weight:600">✍ Cách viết & bộ thủ (bấm từng chữ)</div>
    <div class="chars">${chars.map((c,i)=>`<button class="chb zh ${i===0?"on":""}" data-c="${i}">${esc(c)}</button>`).join("")}</div>
    <div class="chgrid"><div><div class="hw" id="hwBox"></div><div style="display:flex;gap:6px;margin-top:8px;justify-content:center"><button class="btn sm" id="hwPlay">▶ Xem nét</button><button class="btn sm" id="hwQuiz">✍ Tập viết</button></div></div>
      <div id="radBox"></div></div>
    ${info.ex?`<div class="src-sent"><div class="zh" style="font-size:19px">${esc(info.ex)}</div>${info.exVi?`<div class="muted" style="font-size:13px">${esc(info.exVi)}</div>`:""}</div>`:""}`;
  const m=container?(container.innerHTML=html,container):modal(html,true);
  m.querySelector(".wd-big").textContent=w; m.querySelector(".wd-py").textContent=info.py||pyOf(w); m.querySelector("#wdVi").textContent=info.vi||meanOf(w)||"";
  const saveBtn=()=>{ const b=m.querySelector("#wdSave"); const has=bookHas(w); b.textContent=has?"✓ Đã lưu vào sổ từ":"➕ Lưu vào sổ từ"; b.disabled=has; };
  saveBtn(); m.querySelector("#wdSave").onclick=()=>{ bookAdd({w,py:info.py||pyOf(w),vi:info.vi||meanOf(w),ex:info.ex||"",exVi:info.exVi||"",lang:"zh"}); saveBtn(); };
  m.querySelector("#wdSay").onclick=()=>say(w,.85); m.querySelector("#wdSlow").onclick=()=>say(w,.5);
  function showChar(i){
    sel=i; m.querySelectorAll(".chb").forEach((b,k)=>b.classList.toggle("on",k===i));
    const c=chars[i]; const r=CHAR_RAD[c]; const ri=r&&RAD[r];
    m.querySelector("#radBox").innerHTML=`<div class="radbox"><div class="rt"><span class="zh" style="font-size:26px">${esc(c)}</span> <span class="muted" style="font-size:15px">${esc(pyOf(c))}</span>${meanOf(c)?` · <span style="font-weight:500">${esc(meanOf(c))}</span>`:""}</div>
      ${ri?`<div style="margin-top:8px"><b>Bộ thủ:</b> <span class="zh" style="font-size:22px">${esc(r)}</span> ${esc(ri[0])}${ri[1]?`<span class="badge2">gợi ý</span>`:""}</div>${ri[1]?`<div style="font-size:14px;margin-top:4px;color:#40546b">${esc(ri[1])}</div>`:""}`
        :`<div class="muted" style="font-size:14px;margin-top:8px">Chưa có dữ liệu bộ thủ cho chữ này. Bấm “Tra Hanzii” để xem chi tiết.</div>`}</div>`;
    const box=m.querySelector("#hwBox"); box.innerHTML=`<span class="zh" style="font-size:110px;color:var(--p-dark)">${esc(c)}</span>`; writer=null;
    loadHanziWriter().then(ok=>{ if(!ok||sel!==i||!window.HanziWriter) return;
      try{ box.innerHTML=""; writer=HanziWriter.create(box,c,{charDataLoader:hwLoader,width:166,height:166,padding:10,showOutline:true,strokeColor:getComputedStyle(document.documentElement).getPropertyValue("--p-dark").trim()||"#3f7fbf",radicalColor:"#d4566a",delayBetweenStrokes:250,
        onLoadCharDataError:()=>{ writer=null; box.innerHTML=`<span class="zh" style="font-size:110px;color:var(--p-dark)">${esc(c)}</span>`; m.querySelector("#hwPlay").dataset.off="1"; }}); }catch(e){ writer=null; } });
  }
  m.querySelectorAll(".chb").forEach(b=>b.onclick=()=>showChar(+b.dataset.c));
  m.querySelector("#hwPlay").onclick=()=>{ if(writer) writer.animateCharacter(); else window.open("https://hanzii.net/search/word/"+encodeURIComponent(chars[sel]),"_blank","noopener"); };
  m.querySelector("#hwQuiz").onclick=()=>{ if(!container) closeModal(); openWriting(w); TV.idx=sel; };
  if(chars.length) showChar(0);
}

const TRS={dir:store.get("srt_trdir","fv"),scope:store.get("srt_trscope","one")};
function trStore(key){ return store.get("srt_tr_"+key,{})||{}; }
function trSave(key,o){ store.set("srt_tr_"+key,o); }
function trWords(t,lang){ t=String(t||"").toLowerCase().normalize("NFC");
  if(CJK(lang)) return [...t].filter(c=>/[㐀-鿿぀-ヿ0-9]/.test(c));
  return t.replace(/[^\p{L}\p{N}\s']/gu," ").split(/\s+/).filter(Boolean); }
function trSim(a,b,lang){ const A=trWords(a,lang), B=trWords(b,lang); if(!A.length||!B.length) return 0;
  const cnt={}; A.forEach(w=>cnt[w]=(cnt[w]||0)+1); let hit=0; B.forEach(w=>{ if(cnt[w]>0){ hit++; cnt[w]--; } });
  const p=hit/B.length, r=hit/A.length; return p+r?Math.round(2*p*r/(p+r)*100):0; }
function trMark(user,ref,lang){ const R=new Set(trWords(ref,lang)); if(CJK(lang)) return [...user].map(ch=>/[㐀-鿿぀-ヿ]/.test(ch)?`<span class="${R.has(ch)?"dk-ok":""}">${esc(ch)}</span>`:esc(ch)).join("");
  return String(user).split(/(\s+)/).map(w=>{ const k=w.toLowerCase().replace(/[^\p{L}\p{N}']/gu,""); return k&&R.has(k)?`<span class="dk-ok">${esc(w)}</span>`:esc(w); }).join(""); }

    else if(DICT.py) inp.value=refN.slice(0,k+1).join(""); else inp.value=refN.slice(0,k+1).join(" ")+" ";
    inp.focus(); };
  $("#dShow").onclick=()=>{ DICT.shown[i]=true; showRes(); drawCap(); };
  $("#dPrev").onclick=()=>{ stopAll(true); SH.idx=i-1; hiCue(); drawDict(); };
  $("#dNext").onclick=()=>{ stopAll(true); SH.idx=i+1; hiCue(); drawDict(); setTimeout(()=>playCue(SH.idx),150); };
  box.querySelectorAll("[data-dk]").forEach(b=>b.onclick=()=>{ stopAll(true); SH.idx=+b.dataset.dk; hiCue(); drawDict(); });
  inp.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); $("#dCheck").click(); } };
  if(done===N&&N>1&&!DICT._cele){ DICT._cele=true; toast(`🏁 Xong cả video! Trung bình đúng ${avg}%`); }
}

function vSort(a,b){ if(a.cat==="lesson"&&b.cat==="lesson"){ const d=LEVELS.findIndex(l=>l.id===a.level)-LEVELS.findIndex(l=>l.id===b.level); if(d) return d; } return (b.createdAt||0)-(a.createdAt||0); }

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px">${langs.map(k=>{ const n=all.filter(v=>langOf(v.level)===k).length; return `<button class="btn sm ${k===vidLang?"on":""}" data-vl="${k}">${LANGS[k].flag} ${LANGS[k].name}${n?` (${n})`:""}</button>`; }).join("")}</div>

      <input class="vsearch" id="vQ" type="search" placeholder="🔎 Tìm video…" maxlength="60"></div>
    ${subs.length?`<div class="vsubs"><button data-vs="" class="${vidSub?"":"on"}">Tất cả</button>${subs.map(x=>`<button data-vs="${esc(x[0])}" class="${vidSub===x[0]?"on":""}">${esc(x[1])} (${x[2]})</button>`).join("")}</div>`:'<div style="height:6px"></div>'}

      } else if(V.assetId) oldDel.push(V.assetId);
      if(srt){ if(srt.length<180000) d.srt=srt; else { if(!ASSETS) throw {message:"Phụ đề quá dài."}; const r=await ASSETS.upload(new Blob([srt],{type:"text/plain"}),{type:"text/plain"}); d.srtId=r.id; } }

  };
}

const HW_DATA_CACHE={};
function hwLoader(ch, onComplete, onError){
  if(HW_DATA_CACHE[ch]){ onComplete(HW_DATA_CACHE[ch]); return; }
  const done=d=>{ HW_DATA_CACHE[ch]=d; onComplete(d); };
  const url="https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/"+encodeURIComponent(ch)+".json";
  fetch(url).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(done)
    .catch(()=>import(url+"/+esm").then(m=>done(m.default||m)).catch(e=>onError&&onError(e)));
}

  return `<svg class="grid-bg" viewBox="0 0 100 100" preserveAspectRatio="none"><g stroke="currentColor" stroke-width=".6" stroke-dasharray="3 3" fill="none"><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/>${mi}</g></svg>`;
}

        let miss=0, okN=0;

function traceCanvas(box){
  const c=document.createElement("canvas"); const w=box.clientWidth||260; c.width=w*2; c.height=w*2; c.className="tv-canvas"; box.appendChild(c);
  const ctx=c.getContext("2d"); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=hwColor(); ctx.lineWidth=w*0.055;
  let drawing=false, last=null;
  const pt=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]; };
  c.addEventListener("pointerdown",e=>{ drawing=true; last=pt(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7); ctx.fillStyle=ctx.strokeStyle; ctx.fill(); });
  c.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pt(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); last=p; });
  const end=()=>{ drawing=false; }; c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
}

const H="[\\u4e00-\\u9fff]";
const GRAMMAR_LIB=[
  {p:9,re:new RegExp("了[一二三四五六七八九十两几半]+(分钟|小时|天|年|个月|个星期)"),t:"Bổ ngữ thời lượng",f:"Động từ + 了 + khoảng thời gian",d:"Cho biết hành động kéo dài bao lâu. Ví dụ 等了十分钟 = đã đợi mười phút."},
  {p:9,re:new RegExp("得(很|非常|太|不|真|特别)"),t:"Bổ ngữ trình độ với 得",f:"Động từ + 得 + (很/非常…) + tính từ",d:"Đánh giá mức độ, kết quả của hành động. Ví dụ 吃得很饱 = ăn rất no; 说得很好 = nói rất giỏi."},

  {p:8,re:new RegExp("去"+H+"{1,6}?(吃|喝|看|买|学习|玩|上课|工作)"),t:"Câu liên động",f:"去 + nơi chốn + động từ",d:"Hai động từ nối tiếp: đi đâu để làm gì. Ví dụ 去饭馆吃饭 = đi quán để ăn cơm."},
  {p:8,re:new RegExp("教[我你他她们]+(说|学|写|做)"),t:"Câu hai tân ngữ với 教",f:"教 + người + nội dung",d:"教 (dạy) có thể theo sau bởi người được dạy rồi đến điều được dạy. Ví dụ 她教我说汉语 = cô ấy dạy tôi nói tiếng Trung."},
  {p:8,re:new RegExp("给[我你他她们]+"+H),t:"给: đưa, cho ai",f:"给 + người + vật / 给 + người + động từ",d:"Chỉ người nhận. Ví dụ 给了我们一盘鸡肉 = đưa cho chúng tôi một đĩa thịt gà."},
  {p:7,re:new RegExp("[一二三四五六七八九十两几这那每]+(个|张|碗|盘|家|本|杯|口|位|件|条|只)"),t:"Số từ + lượng từ + danh từ",f:"Số / 这 / 那 + lượng từ + danh từ",d:"Tiếng Trung luôn cần lượng từ giữa số và danh từ: 一个朋友, 一张桌子, 一碗面, 一家饭馆."},
  {p:7,re:/每(个|天|星期|年|月)/,t:"每: mỗi",f:"每 + (lượng từ) + danh từ",d:"Diễn tả sự lặp lại đều đặn. Ví dụ 每个星期六 = mỗi thứ Bảy. Thường đi kèm 都 phía sau."},
  {p:7,re:/太.{1,4}了/,t:"太…了: quá…",f:"太 + tính từ + 了",d:"Nhấn mạnh mức độ quá cao (khen hoặc chê). Ví dụ 太好了 = tuyệt quá."},
  {p:7,re:/比/,t:"Câu so sánh với 比",f:"A + 比 + B + tính từ",d:"A hơn B. Không dùng 很 trước tính từ trong câu 比."},
  {p:6,re:/才/,t:"才: mới (muộn hơn dự kiến)",f:"Thời gian / điều kiện + 才 + động từ",d:"Nhấn mạnh việc xảy ra muộn hoặc khó hơn mong đợi. Ví dụ 等了十分钟，才有一张桌子 = đợi mười phút mới có bàn."},
  {p:6,re:/马上/,t:"马上: ngay lập tức",f:"马上 + động từ",d:"Hành động sẽ xảy ra ngay. Ví dụ 我马上换 = tôi đổi ngay."},
  {p:6,re:/一起/,t:"一起: cùng nhau",f:"Chủ ngữ + 一起 + động từ",d:"一起 đứng trước động từ. Ví dụ 我们一起去喝咖啡 = chúng mình cùng đi uống cà phê."},
  {p:6,re:/可是|但是/,t:"可是 / 但是: nhưng",f:"Vế 1，可是 / 但是 + vế 2",d:"Nối hai vế có ý trái ngược, đứng đầu vế sau."},
  {p:6,re:/(想|要|会|能|可以)(?=[一-鿿])/,t:"Động từ năng nguyện",f:"想 / 要 / 会 / 能 / 可以 + động từ",d:"想 muốn · 要 cần, sẽ · 会 biết (kỹ năng) · 能/可以 có thể. Đứng ngay trước động từ chính."},
  {p:6,re:/吧[。！？!?]?$/,t:"吧 cuối câu",f:"Câu + 吧",d:"Làm câu mềm hơn: đề nghị (我们走吧 = mình đi thôi) hoặc phỏng đoán."},

  {p:5,re:/什么/,t:"Từ để hỏi 什么",f:"… + 什么 + (danh từ)？",d:"Hỏi “gì”. Không đảo trật tự câu: 你叫什么名字？ = Bạn tên là gì?"},
  {p:5,re:new RegExp("叫"+H),t:"叫 + tên",f:"Chủ ngữ + 叫 + tên",d:"Dùng để nói tên. Hỏi: 你叫什么名字？"},
  {p:5,re:new RegExp("在"+H+"{1,5}(学习|工作|住|吃|看|买|上课)"),t:"在 + nơi chốn + động từ",f:"Chủ ngữ + 在 + nơi chốn + động từ",d:"Cụm chỉ nơi chốn đứng TRƯỚC động từ (khác tiếng Việt). Ví dụ 我在北京学习 = tôi học ở Bắc Kinh."},
  {p:5,re:/呢[？?]/,t:"Câu hỏi rút gọn với 呢",f:"Danh từ / đại từ + 呢？",d:"Hỏi lại cùng câu hỏi trước đó: “còn … thì sao?”. Ví dụ 我是越南人，你呢？"},
  {p:4,re:/吗[？?]?/,t:"Câu hỏi có/không với 吗",f:"Câu trần thuật + 吗？",d:"Thêm 吗 cuối câu để hỏi có/không; trật tự từ giữ nguyên."},
  {p:4,re:new RegExp("很(?="+H+")"),t:"很 + tính từ",f:"Chủ ngữ + 很 + tính từ",d:"Tính từ làm vị ngữ thường có 很 đứng trước (không dùng 是). Ví dụ 我很好, 人很多."},
  {p:4,re:/也/,t:"也: cũng",f:"Chủ ngữ + 也 + động từ / tính từ",d:"也 luôn đứng sau chủ ngữ, trước động từ: 我也是学生 (không nói 也我是)."},
  {p:3,re:/(?<![可还但就总于])是/,t:"Câu chữ 是",f:"A + 是 + B",d:"“A là B”, nối hai danh từ. Phủ định: A 不是 B. Không dùng 是 trước tính từ."},
  {p:3,re:/和/,t:"和: và, với",f:"Danh từ + 和 + danh từ",d:"Chỉ nối danh từ hoặc đại từ (我和朋友), không dùng để nối hai câu."},
  {p:3,re:/有/,t:"有: có",f:"Chủ ngữ + 有 + tân ngữ",d:"Phủ định là 没有 (không dùng 不有)."},
  {p:2,re:/的/,t:"的: định ngữ / sở hữu",f:"Định ngữ + 的 + danh từ",d:"Nối phần bổ nghĩa với danh từ: 我的朋友 = bạn của tôi, 这里的菜 = món ở đây."},
  {p:2,re:/了/,t:"了: hoàn thành / thay đổi",f:"Động từ + 了 · Câu + 了",d:"Sau động từ: hành động đã hoàn thành (我点了一碗面). Cuối câu: tình huống đã thay đổi (现在我们是好朋友了)."},
  {p:1,re:/不(?![好]意思)/,t:"Phủ định với 不",f:"不 + động từ / tính từ",d:"Phủ định hiện tại, tương lai, thói quen. 不 đọc thành bú khi đứng trước thanh 4 (不是 bú shì)."}
];
function hanRuns(s){ return (String(s||"").match(/[一-鿿]+/g)||[]); }
function grammarFor(text, note, lang, lessonGrammar){
  const out=[]; if(note) out.push({t:"Ghi chú ngữ pháp",d:note,src:"note"});
  if((lang||CUR_LANG)!=="zh") return out;
  const used=new Set();
  (lessonGrammar||[]).forEach(g=>{ const runs=hanRuns(g.f).concat(hanRuns(g.t)).filter(r=>r!=="是"||hanRuns(g.f).length===1); if(runs.some(r=>text.includes(r))){ out.push({t:g.t,f:g.f,d:g.d,src:"lesson"}); runs.forEach(r=>used.add(r)); } });
  GRAMMAR_LIB.filter(g=>g.re.test(text)).sort((a,b)=>b.p-a.p).forEach(g=>{ if(hanRuns(g.f).some(r=>used.has(r))) return; out.push({t:g.t,f:g.f,d:g.d,src:"lib"}); });
  return out.slice(0,5);
}
function grHTML(list){
  if(!list.length) return `<div class="muted" style="font-size:13px">Câu này không có điểm ngữ pháp đáng chú ý.</div>`;
  return list.map(g=>`<div class="gr-item"><div class="gr-t">${g.src==="lesson"?'<span class="gr-tag">Ngữ pháp của bài</span>':g.src==="note"?'<span class="gr-tag note">Ghi chú</span>':""}<b>${esc(g.t)}</b></div>${g.f?`<div class="gr-f zh">${esc(g.f)}</div>`:""}<div class="gr-d">${esc(g.d)}</div></div>`).join("");
}
